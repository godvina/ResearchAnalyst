function drawGrid() {
    gridLayer.clearLayers();
    var nodeMap = {};
    allNodes.forEach(function(n){ nodeMap[n.id] = n; });

    // Draw triangle edges (faint)
    GRID_TRIANGLES.forEach(function(edge) {
        var a = nodeMap[edge[0]], b = nodeMap[edge[1]];
        if (!a || !b) return;
        if (Math.abs(a.lat) >= 85 || Math.abs(b.lat) >= 85) return;
        var ld = Math.abs(a.lng - b.lng);
        if (ld > 180) ld = 360 - ld;
        if (ld > 120) return;
        L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
            color:'#718096', weight:0.9, opacity:0.6
        }).addTo(gridLayer);
    });

    // Draw vertices as small diamonds
    allNodes.forEach(function(n) {
        if (Math.abs(n.lat) >= 85) return;
        var icon = L.divIcon({
            className:'grid-vertex',
            html:'<svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="none" stroke="#a0aec0" stroke-width="1.5"/></svg>',
            iconSize:[10,10], iconAnchor:[5,5]

        var marker = L.marker([n.lat, n.lng], {icon:icon}).addTo(gridLayer);
        marker.bindTooltip('Vertex ' + n.id, {direction:'top', offset:[0,-6], className:'node-label'});
        marker.nodeData = n;
        marker.on('click', function(){ showNodeBrief(n); });
    });
}

function drawFocusConnections(patternId, matchNodeIds, nodeMap) {
    // Only draw lines between nodes sharing SPECIFIC non-generic indicators

    var sigId = PATTERNS.find(function(p){ return p.id === patternId; });
    if (!sigId) return;
    sigId = sigId.sigId;

    var genericTerms = ['Within','km','node','ocean'];

    for (var i = 0; i < matchNodeIds.length; i++) {
        for (var j = i + 1; j < matchNodeIds.length; j++) {
            var sA = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[i]; });
            var sB = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[j]; });
            if (!sA || !sB) continue;

            var mA = sA.matches.find(function(m){ return m.signature_id === sigId; });
            var mB = sB.matches.find(function(m){ return m.signature_id === sigId; });
            if (!mA || !mB) continue;

            // Both must be strong or moderate
            if (mA.confidence === 'weak' || mB.confidence === 'weak') continue;

            var indA = mA.matched_indicators || [];
            var indB = mB.matched_indicators || [];
            var shared = indA.filter(function(x){
                if (genericTerms.some(function(g){ return x.indexOf(g) >= 0; })) return false;
                return indB.indexOf(x) >= 0;
            });
            if (shared.length === 0) continue;

            var nA = nodeMap[matchNodeIds[i]], nB = nodeMap[matchNodeIds[j]];
            if (!nA || !nB) continue;
            var siteA = KNOWN_SITES.find(function(s){ return s.nodeId === nA.id; });
            var siteB = KNOWN_SITES.find(function(s){ return s.nodeId === nB.id; });
            var latA = siteA ? siteA.realLat : nA.lat, lngA = siteA ? siteA.realLng : nA.lng;
            var latB = siteB ? siteB.realLat : nB.lat, lngB = siteB ? siteB.realLng : nB.lng;

            if (Math.abs(lngA - lngB) > 180) continue;

            var line = L.polyline([[latA,lngA],[latB,lngB]], {
                color:'#ecc94b', weight: 1 + shared.length * 0.5, opacity: 0.4 + shared.length * 0.1
            }).addTo(focusLayer);
            var nameA = siteA ? siteA.name : getNodeLabel(nA);
            var nameB = siteB ? siteB.name : getNodeLabel(nB);
            line.bindTooltip(nameA + ' ↔ ' + nameB + ': ' + shared.join(', '), {sticky:true, className:'node-label'});
        }
    }
}

function getMatchingNodes(patternId) {
    if (!scoredData || !scoredData.results) return [];
    var pattern = PATTERNS.find(function(p){ return p.id === patternId; });
    if (!pattern) return [];
    var ids = [];
    scoredData.results.forEach(function(r) {
        if (!r.matches) return;
        var hit = r.matches.find(function(m){ return m.signature_id === pattern.sigId; });
        if (hit && hit.confidence !== 'weak') ids.push(r.node_id);
    });
    return ids;
}

// Haversine distance in km between two lat/lng points
function haversineKm(lat1, lng1, lat2, lng2) {
    var R = 6371;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng/2) * Math.sin(dLng/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

        var r = researchData.results.find(function(x){ return x.node_id === n.id; });
        if (r && r.brief && r.brief.codename) {
            // Convert APEX_GIZA → Apex Giza, TOBOL_STEPPE → Tobol Steppe
            var name = r.brief.codename.replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); }).replace(/\b(Node|Grid)\b/gi,'').trim();
            if (name.length > 20) name = name.substring(0,18) + '..';
            return 'V' + n.id + ' ' + name;
        }
    }
    // Fallback: continent
    return 'V' + n.id + (n.continent ? ' ' + n.continent : '');
}

                        brief.investigation_status === 'PROBABLE' ? 'probable' : 'inconclusive';

// NETWORK GRAPH (D3 force-directed) — opens over map on pattern focus
// =====================================================================
function showNetworkGraph(patternId) {
    var pattern = PATTERNS.find(function(p){ return p.id === patternId; });
    if (!pattern || !scoredData) return;

    var panel = document.getElementById('networkPanel');
    var title = document.getElementById('networkTitle');
    panel.style.display = 'flex';
    setTimeout(function(){ map.invalidateSize(); }, 100);

    // Build nodes and edges from scored data
    var matchNodeIds = getMatchingNodes(patternId);
    var nodes = [];
    var edges = [];

    matchNodeIds.forEach(function(id) {
        var n = allNodes.find(function(x){ return x.id === id; });
        if (!n) return;
        var label = getNodeLabel(n);
        var scored = scoredData.results.find(function(r){ return r.node_id === id; });
        var matchCount = scored ? scored.matches.length : 0;
        nodes.push({id: id, label: label, continent: n.continent || 'Ocean', matchCount: matchCount});
    });

    // ONLY draw edges between nodes sharing SPECIFIC non-generic indicators
    // Exclude indicators that simply restate the pattern definition (these match ALL nodes in the pattern)
    var genericTerms = ['Within','km','node','ocean','Indigenous oral tradition','500+ year continuity','Plate boundary','High seismic','Shallow plateau','Depth <200m','5+ ancient sites clustered','ancient sites clustered','Within 300km','Within 500km','concentration of','improbable'];
    if (scoredData && scoredData.results) {
        for (var i = 0; i < matchNodeIds.length; i++) {
            for (var j = i + 1; j < matchNodeIds.length; j++) {
                var sA = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[i]; });
                var sB = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[j]; });
                if (!sA || !sB) continue;
                var mA = (sA.matches || []).find(function(m){ return m.signature_id === pattern.sigId; });
                var mB = (sB.matches || []).find(function(m){ return m.signature_id === pattern.sigId; });
                if (!mA || !mB) continue;
                if (mA.confidence === 'weak' || mB.confidence === 'weak') continue;
                var indA = mA.matched_indicators || [];
                var indB = mB.matched_indicators || [];
                var shared = indA.filter(function(x){
                    if (genericTerms.some(function(g){ return x.toLowerCase().indexOf(g.toLowerCase()) >= 0; })) return false;
                    return indB.indexOf(x) >= 0;
                });
                if (shared.length > 0) {
                    edges.push({source: matchNodeIds[i], target: matchNodeIds[j], label: shared[0], weight: shared.length});
                }
            }
        }
        // Cap at 15 edges max to prevent spaghetti
        if (edges.length > 15) {
            edges.sort(function(a,b){ return b.weight - a.weight; });
            edges = edges.slice(0, 15);
        }
    }

    // Generate intelligence summary
    var summary = generatePatternInsight(pattern, nodes, edges);
    title.innerHTML = '🕸️ <span style="color:#e2e8f0;font-weight:400;font-size:0.65rem;margin-left:8px;">' + summary + '</span>';

    renderD3Network(nodes, edges, pattern.color);
}

function generatePatternInsight(pattern, nodes, edges) {
    var continents = {};
    nodes.forEach(function(n){ continents[n.continent] = (continents[n.continent]||0) + 1; });
    var numContinents = Object.keys(continents).filter(function(c){ return c !== 'Ocean'; }).length;
    
    // Generate a "so what" insight, not just stats
    if (pattern.id === 'sacred') {
        if (edges.length > 0) {
            return '🔑 ' + edges.length + ' pairs share SPECIFIC ceremonial traits (not just "sacred") across ' + numContinents + ' continents with no known cultural contact — this demands an explanation beyond coincidence.';
        }
        return '⚠️ ' + nodes.length + ' sites on ' + numContinents + ' continents designated sacred independently. No specific shared ceremonies detected yet — run Cross-Pattern Agent to find hidden connections.';
    } else if (pattern.id === 'cluster') {
        if (edges.length > 0) {
            return '🔑 ' + edges.length + ' site-cluster pairs share specific archaeological features beyond mere proximity — suggesting coordinated placement or shared construction tradition.';
        }
        return '⚠️ ' + nodes.length + ' vertices each have 5+ ancient sites within 300km. Currently no SPECIFIC shared features link them — each cluster may be independently significant, or we haven\'t found the connection yet.';
    } else if (pattern.id === 'submerged') {
        return '🔑 ' + nodes.length + ' ocean grid vertices sit on shallow platforms that were habitable coastline 12,000+ years ago. If pre-flood civilizations existed, these are where their ruins would be.';
    } else if (pattern.id === 'tectonic') {
        return '🔑 ' + nodes.length + ' grid vertices coincide with tectonic boundaries. This either means the grid reflects geological forces, or ancient peoples SELECTED geomagnetically active locations.';
    } else if (pattern.id === 'geometric') {
        return '🔑 ' + nodes.length + ' vertices show precise geometric formations. If natural: the grid encodes planetary geometry. If constructed: someone was working to mathematical specifications.';
    }
    if (pattern.id === 'greatcircle') {
        return '🔑 ' + nodes.length + ' sites lie on a SINGLE great circle spanning 40,000km with <1° deviation (Jim Alison 2001). This precision over intercontinental distances requires either shared geodetic knowledge or extraordinary coincidence.';
    } else if (pattern.id === 'orion') {
        return '🔑 ' + nodes.length + ' sites encode the SAME precessional sky-date (10,500 BCE) via constellation ground-plans — Giza/Orion, Angkor/Draco, Teotihuacan/Orion. Independent civilizations, separated by oceans and millennia, pointing to the same moment.';
    }
    return nodes.length + ' vertices match across ' + numContinents + ' continents. ' + (edges.length > 0 ? edges.length + ' share specific traits.' : 'No specific cross-site traits found yet.');
}

function renderD3Network(nodes, edges, color) {
    var svg = d3.select('#networkSvg');
    svg.selectAll('*').remove();

    var panel = document.getElementById('networkPanel');
    var width = panel.clientWidth || 700;
    var height = 300;

    svg.attr('viewBox', '0 0 ' + width + ' ' + height);

    // Color by continent
    var continentColors = {
        'Africa': '#ecc94b', 'Asia': '#fc8181', 'Europe': '#48bb78',
        'North America': '#63b3ed', 'South America': '#b794f4',
        'Oceania': '#ed64a6', 'Ocean': '#4a5568', 'Pacific': '#4a5568'
    };

    var simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(function(d){ return d.id; }).distance(120))
        .force('charge', d3.forceManyBody().strength(-350))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(50));

    // Draw edges
    var link = svg.append('g').selectAll('line')
        .data(edges).enter().append('line')
        .attr('class', 'link-line')
        .attr('stroke', color)
        .attr('stroke-width', function(d){ return Math.min(d.weight + 0.5, 3); })
        .attr('cursor', 'pointer')
        .on('click', function(event, d) {
            // Show relationship explanation in the brief panel
            var briefPanel = document.getElementById('networkBrief');
            var sourceNode = allNodes.find(function(n){ return n.id === (d.source.id || d.source); });
            var targetNode = allNodes.find(function(n){ return n.id === (d.target.id || d.target); });
            var srcLabel = sourceNode ? getNodeLabel(sourceNode) : d.source.label || d.source;
            var tgtLabel = targetNode ? getNodeLabel(targetNode) : d.target.label || d.target;
            var html = '';
            html += '<div style="color:#ecc94b;font-weight:700;font-size:0.78rem;margin-bottom:6px;">🔗 RELATIONSHIP</div>';
            html += '<div style="font-size:0.72rem;color:#e2e8f0;margin-bottom:8px;line-height:1.5;">';
            html += '<span style="color:#f6ad55;font-weight:600;">' + srcLabel + '</span>';
            html += ' <span style="color:#718096;">↔</span> ';
            html += '<span style="color:#f6ad55;font-weight:600;">' + tgtLabel + '</span></div>';
            html += '<div style="background:rgba(236,201,75,0.08);border:1px solid rgba(236,201,75,0.2);border-radius:5px;padding:10px;margin-bottom:8px;">';
            html += '<div style="font-size:0.62rem;font-weight:700;color:#ecc94b;margin-bottom:4px;">WHY THIS MATTERS</div>';
            html += '<div style="font-size:0.7rem;color:#cbd5e0;line-height:1.6;">';
            html += 'These two sites share <strong style="color:#e2e8f0;">' + d.weight + ' specific trait' + (d.weight > 1 ? 's' : '') + '</strong>:<br>';
            html += '<div style="margin-top:6px;padding-left:8px;border-left:2px solid rgba(236,201,75,0.3);">';
            html += '• ' + (d.label || 'Unknown shared trait');
            html += '</div></div></div>';
            // Distance context
            if (sourceNode && targetNode) {
                var dist = Math.round(haversineKm(sourceNode.lat, sourceNode.lng, targetNode.lat, targetNode.lng));
                html += '<div style="font-size:0.66rem;color:#a0aec0;margin-bottom:8px;">';
                html += '📏 Distance: <strong style="color:#e2e8f0;">' + dist.toLocaleString() + ' km apart</strong></div>';
                if (dist > 3000) {
                    html += '<div style="font-size:0.65rem;color:#fc8181;font-style:italic;line-height:1.5;">Sites separated by ' + dist.toLocaleString() + ' km sharing the same trait rules out coincidence or trade contact. This requires either shared knowledge, independent discovery, or a common precursor.</div>';
                }
            }
            html += '<div style="font-size:0.58rem;color:#4a5568;margin-top:10px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05);">Click nodes for full intelligence briefs</div>';
            briefPanel.innerHTML = html;
            // Highlight this edge
            svg.selectAll('.link-line').attr('stroke-opacity', 0.2);
            d3.select(this).attr('stroke-opacity', 1).attr('stroke-width', 4);
            setTimeout(function(){ svg.selectAll('.link-line').attr('stroke-opacity', 0.4).attr('stroke-width', function(dd){ return Math.min(dd.weight + 0.5, 3); }); }, 2000);
        })
        .on('mouseenter', function(event, d) {
            d3.select(this).attr('stroke-opacity', 0.9).attr('stroke-width', 4);
        })
        .on('mouseleave', function(event, d) {
            d3.select(this).attr('stroke-opacity', 0.4).attr('stroke-width', function(dd){ return Math.min(dd.weight + 0.5, 3); });
        });

    // Draw nodes
    var node = svg.append('g').selectAll('g')
        .data(nodes).enter().append('g')
        .attr('class', 'network-node-group')
        .attr('cursor', 'pointer')
        .call(d3.drag()
            .on('start', function(event, d){ d._dragged = false; if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', function(event, d){ d._dragged = true; d.fx = event.x; d.fy = event.y; })
            .on('end', function(event, d){ if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        );

    // Circle for each node
    node.append('circle')
        .attr('class', 'node-circle')
        .attr('r', function(d){ return d.isHub ? 14 : 8 + (d.matchCount || 0) * 2; })
        .attr('fill', function(d){ return continentColors[d.continent] || color; })
        .attr('stroke', '#1a202c')
        .attr('stroke-width', 2)
        .attr('data-node-id', function(d){ return d.id; });

    // Labels always visible — ABOVE nodes for clarity
    node.append('text')
        .attr('class', 'node-text')
        .attr('dy', function(d){ return -((d.isHub ? 14 : 8 + (d.matchCount || 0) * 2) + 6); })
        .attr('fill', '#e2e8f0')
        .attr('font-size', '9px')
        .attr('font-weight', '600')
        .attr('text-anchor', 'middle')
        .text(function(d){ 
            var lbl = d.label || d.id || '';
            return lbl.length > 20 ? lbl.substring(0,18) + '..' : lbl;
        });

    // Click node in network graph → show insight + highlight on map
    // Uses _dragged flag to avoid triggering on drag-end
    node.on('click', function(event, d) {
        if (d._dragged) { d._dragged = false; return; }
        
        // Find the allNodes entry
        var mapNode = allNodes.find(function(n){ return n.id === d.id; });
        
        if (mapNode) {
            // Pulse on map
            L.circleMarker([mapNode.lat, mapNode.lng], {
                radius: 18, color: '#fff', fillColor: 'transparent', weight: 2, opacity: 0.8
            }).addTo(focusLayer);
            map.setView([mapNode.lat, mapNode.lng], Math.max(map.getZoom(), 4), {animate: true});
        }
        
        // Show contextual brief in the network panel's brief area
        showNetworkNodeBrief(d.id);
        
        // LEVEL 2 DRILL-DOWN: Also show the full documentary brief in the main sidebar
        if (mapNode) showNodeBrief(mapNode);
        
        // Flash the sidebar to signal it updated
        var sb = document.getElementById('sidebar');
        sb.style.transition = 'background 0.3s';
        sb.style.background = 'rgba(236,201,75,0.08)';
        sb.scrollTop = 0;
        setTimeout(function(){ sb.style.background = ''; }, 600);
        
        // Highlight in network
        svg.selectAll('.node-circle').attr('stroke', '#1a202c').attr('stroke-width', 2);
        d3.select(this).select('circle').attr('stroke', '#fff').attr('stroke-width', 3);
    });
    
    // Hover shows quick tooltip (contextual to active pattern)
    node.on('mouseenter', function(event, d) {
        showNetworkNodeBrief(d.id);
    });

    // Tick
    simulation.on('tick', function() {
        link.attr('x1', function(d){ return d.source.x; }).attr('y1', function(d){ return d.source.y; })
            .attr('x2', function(d){ return d.target.x; }).attr('y2', function(d){ return d.target.y; });
        node.attr('transform', function(d){ return 'translate(' + d.x + ',' + d.y + ')'; });
    });

    // Store reference for cross-highlighting from map clicks
    window._networkSvg = svg;
    window._networkNodes = nodes;
}

// Highlight a node in the network graph (called from map click)
function highlightNetworkNode(nodeId) {
    if (!window._networkSvg) return;
    var svg = window._networkSvg;
    // Reset all
    svg.selectAll('.node-circle').attr('stroke', '#1a202c').attr('stroke-width', 2);
    // Find and highlight matching node
    var label = '';
    var n = allNodes.find(function(x){ return x.id === nodeId; });

        }
    });
}

function closeNetworkGraph() {
    document.getElementById('networkPanel').style.display = 'none';
    setTimeout(function(){ map.invalidateSize(); }, 100);
}

// Show full intelligence brief in the network panel's brief area
// 2-LEVEL DRILL-DOWN: Shows this node's role IN THE CONTEXT of the active pattern
function showNetworkNodeBrief(nodeId) {
    var briefPanel = document.getElementById('networkBrief');
    var n = allNodes.find(function(x){ return x.id === nodeId; });
    if (!n) return;
    
    var brief = null;
    if (researchData && researchData.results) {
        var r = researchData.results.find(function(x){ return x.node_id === nodeId; });
        if (r) brief = r.brief;
    }
    
    // Get scored data for this node
    var scored = null;
    if (scoredData && scoredData.results) {
        scored = scoredData.results.find(function(x){ return x.node_id === nodeId; });
    }
    
    var html = '';
    
    // Level 1: Node identity
    if (brief) {
        var statusColor = brief.investigation_status === 'CONFIRMED' ? '#48bb78' : 
                          brief.investigation_status === 'PROBABLE' ? '#63b3ed' : '#718096';
        html += '<div style="color:#ecc94b;font-weight:700;font-size:0.82rem;margin-bottom:2px;">' + brief.codename + '</div>';
        html += '<div style="color:' + statusColor + ';font-size:0.68rem;font-weight:600;margin-bottom:8px;">' + brief.investigation_status + '</div>';
    } else {
        html += '<div style="color:#e2e8f0;font-weight:700;font-size:0.82rem;margin-bottom:2px;">' + getNodeLabel(n) + '</div>';
        html += '<div style="color:#718096;font-size:0.68rem;margin-bottom:8px;">NO DATA</div>';
    }
    
    // Level 2: CONTEXTUAL — this node's role in the active pattern
    if (_focusedPattern && scored) {
        var activePattern = PATTERNS.find(function(p){ return p.id === _focusedPattern; });
        if (activePattern) {
            var match = (scored.matches || []).find(function(m){ return m.signature_id === activePattern.sigId; });
            if (match) {
                html += '<div style="background:rgba(236,201,75,0.08);border:1px solid rgba(236,201,75,0.2);border-radius:5px;padding:8px;margin-bottom:8px;">';
                html += '<div style="color:#ecc94b;font-size:0.62rem;font-weight:700;margin-bottom:4px;">🔗 ROLE IN: ' + activePattern.title.toUpperCase() + '</div>';
                html += '<div style="color:#e2e8f0;font-size:0.72rem;line-height:1.5;">';
                html += '<span style="color:' + activePattern.color + ';font-weight:700;">' + match.confidence.toUpperCase() + '</span> match';
                // Filter out generic indicators
                var genericTerms = ['Within','km','node','ocean','5+ ancient sites clustered','ancient sites clustered','Within 300km','concentration of','improbable'];
                var specificIndicators = (match.matched_indicators || []).filter(function(x){
                    return !genericTerms.some(function(g){ return x.toLowerCase().indexOf(g.toLowerCase()) >= 0; });
                });
                if (specificIndicators.length > 0) {
                    html += '<div style="margin-top:5px;color:#cbd5e0;font-size:0.7rem;line-height:1.5;">';
                    html += '• ' + specificIndicators.slice(0,3).join('<br>• ');
                    html += '</div>';
                } else {
                    html += '<div style="margin-top:5px;color:#718096;font-size:0.66rem;font-style:italic;">';
                    html += 'Matches pattern definition but no site-specific indicators yet. Run Cross-Pattern Agent for deeper analysis.</div>';
                }
                html += '</div></div>';
                
                // Find shared traits with OTHER nodes in this pattern (SPECIFIC only)
                var matchNodeIds = getMatchingNodes(_focusedPattern);
                var sharedWith = [];
                matchNodeIds.forEach(function(otherId) {
                    if (otherId === nodeId) return;
                    var otherScored = scoredData.results.find(function(r){ return r.node_id === otherId; });
                    if (!otherScored) return;
                    var otherMatch = (otherScored.matches || []).find(function(m){ return m.signature_id === activePattern.sigId; });
                    if (!otherMatch) return;
                    var indA = (match.matched_indicators || []).filter(function(x){
                        return !genericTerms.some(function(g){ return x.toLowerCase().indexOf(g.toLowerCase()) >= 0; });
                    });
                    var indB = (otherMatch.matched_indicators || []).filter(function(x){
                        return !genericTerms.some(function(g){ return x.toLowerCase().indexOf(g.toLowerCase()) >= 0; });
                    });
                    var shared = indA.filter(function(x){ return indB.indexOf(x) >= 0; });
                    if (shared.length > 0) {
                        var otherNode = allNodes.find(function(x){ return x.id === otherId; });
                        sharedWith.push({name: getNodeLabel(otherNode), traits: shared});
                    }
                });
                
                if (sharedWith.length > 0) {
                    html += '<div style="font-size:0.65rem;color:#ecc94b;font-weight:600;margin-top:6px;margin-bottom:4px;">🔑 Shares SPECIFIC traits with:</div>';
                    sharedWith.slice(0,3).forEach(function(sw) {
                        html += '<div style="font-size:0.64rem;color:#a0aec0;margin-top:3px;padding-left:6px;border-left:2px solid rgba(236,201,75,0.3);">↔ ' + sw.name + '<br><em style="color:#718096">' + sw.traits.slice(0,2).join(', ') + '</em></div>';
                    });
                } else {
                    html += '<div style="font-size:0.62rem;color:#718096;margin-top:6px;font-style:italic;">No specific shared features with other nodes in this pattern. This site may be independently significant, or deeper research is needed.</div>';
                }
            }
        }
    }
    
    // Brief context
    if (brief) {
        html += '<div style="color:#cbd5e0;font-size:0.7rem;margin-top:8px;line-height:1.5;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);">' + brief.situation.split('.').slice(0,2).join('.') + '.</div>';
        if (brief.smoking_gun) {
            html += '<div style="color:#ecc94b;font-size:0.66rem;margin-top:6px;line-height:1.4;">💡 ' + brief.smoking_gun.split('.')[0] + '.</div>';
        }
    } else {
        html += '<div style="color:#718096;font-size:0.7rem;margin-top:8px;">No research brief available. Run agent chain to generate.</div>';
    }
    
    html += '<div style="color:#4a5568;font-size:0.58rem;margin-top:10px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.05);">Click node on map for full documentary brief →</div>';
    
    briefPanel.innerHTML = html;
}

// Generate a 2-3 sentence insight for a node in the context of the current pattern
function getNodeInsight(nodeId) {
    var n = allNodes.find(function(x){ return x.id === nodeId; });
    if (!n) return '';
    var brief = null;
    if (researchData && researchData.results) {
        var r = researchData.results.find(function(x){ return x.node_id === nodeId; });
        if (r) brief = r.brief;
    }
    if (!brief) return getNodeLabel(n) + ' — no research brief available yet.';
    
    // Build contextual insight
    var insight = brief.codename + ': ' + brief.situation.split('.').slice(0,2).join('.') + '.';
    if (brief.smoking_gun) {
        insight += ' Key finding: ' + brief.smoking_gun.split('.')[0] + '.';
    }
    return insight;
}

// EMERGENT PATTERNS (loaded from OpenSearch k-NN analysis)
// =====================================================================
var emergentData = null;

async function loadEmergentPatterns() {
    try {
        var r = await fetch(API_BASE + '/emergent');
        if (r.ok) { emergentData = await r.json(); renderEmergent(); return; }
    } catch(e) {}
    try {
        var r2 = await fetch('../data/emergent-patterns.json');
        if (r2.ok) { emergentData = await r2.json(); renderEmergent(); }
    } catch(e) {}
}

function renderEmergent() {
    var el = document.getElementById('emergentPatterns');
    if (!el || !emergentData || !emergentData.patterns) return;

    // Group into clusters (multiple pairs involving same nodes = a cluster)
    var nodeCounts = {};
    emergentData.patterns.forEach(function(p) {
        nodeCounts[p.node_a_name] = (nodeCounts[p.node_a_name] || 0) + 1;
        nodeCounts[p.node_b_name] = (nodeCounts[p.node_b_name] || 0) + 1;
    });

    // Find the most-connected nodes (hubs of emergent clusters)
    var hubs = Object.entries(nodeCounts).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);

    var html = '';
    hubs.forEach(function(hub, i) {
        var name = hub[0];
        var count = hub[1];
        // Find what themes this hub shares
        var themes = new Set();
        emergentData.patterns.forEach(function(p) {
            if (p.node_a_name === name || p.node_b_name === name) {
                (p.shared_themes || []).forEach(function(t){ themes.add(t); });
            }
        });
        var themeStr = Array.from(themes).slice(0,4).join(', ');
        html += '<div style="padding:5px 0;border-bottom:1px solid rgba(183,148,244,0.1);cursor:pointer;" onclick="focusEmergentHub(\'' + name.replace(/'/g,"\\'") + '\')">';
        html += '<span style="color:#b794f4;font-weight:600;">' + (i+1) + '.</span> ';
        html += '<span style="color:#e2e8f0;">' + name + '</span>';
        html += '<div style="font-size:0.58rem;color:#718096;margin-top:2px;">';
        html += 'Connected to ' + count + ' other nodes | Themes: ' + (themeStr || 'deep similarity');
        html += '</div></div>';
    });

    html += '<div style="font-size:0.55rem;color:#718096;margin-top:8px;">';
    html += emergentData.total_pairs + ' unexpected similarity pairs detected.';
    html += '</div>';

    el.innerHTML = html;
}

// =====================================================================
// EMERGENT HUB FOCUS — click an emergent pattern to explore it
// =====================================================================
function focusEmergentHub(hubName) {
    if (!emergentData) return;

    // Find all nodes connected to this hub
    var connectedNodes = new Set();
    var connections = [];
    connectedNodes.add(hubName);

    emergentData.patterns.forEach(function(p) {
        if (p.node_a_name === hubName) {
            connectedNodes.add(p.node_b_name);
            connections.push({from: p.node_a_name, to: p.node_b_name, similarity: p.similarity, themes: p.shared_themes || []});
        } else if (p.node_b_name === hubName) {
            connectedNodes.add(p.node_a_name);
            connections.push({from: p.node_a_name, to: p.node_b_name, similarity: p.similarity, themes: p.shared_themes || []});
        }
    });

    // Find node IDs for these codenames
    var matchNodeIds = [];
    allNodes.forEach(function(n) {
        var brief = null;
        if (researchData && researchData.results) {
            var r = researchData.results.find(function(x){ return x.node_id === n.id; });
            if (r) brief = r.brief;
        }
        var codename = brief ? brief.codename : '';
        if (connectedNodes.has(codename) || connectedNodes.has(n.nearest_known_site || '')) {
            matchNodeIds.push(n.id);
        }
    });

    // Focus the map on these nodes
    focusLayer.clearLayers();
    map.removeLayer(focusLayer);
    // Dim sites only — keep grid skeleton visible
    siteLayer.eachLayer(function(l){ if(l.setStyle) l.setStyle({opacity:0.1, fillOpacity:0.1}); if(l.setOpacity) l.setOpacity(0.15); });

    var focusNodes = [];
    matchNodeIds.forEach(function(id) {
        var n = allNodes.find(function(x){ return x.id === id; });
        if (!n || Math.abs(n.lat) >= 85) return;
        focusNodes.push(n);
        L.circleMarker([n.lat, n.lng], {
            radius: 9, color:'#b794f4', fillColor:'#b794f4', fillOpacity:0.6, weight:2
        }).addTo(focusLayer);
    });
    focusLayer.addTo(map);

    if (focusNodes.length > 1) {
        var bounds = focusNodes.map(function(n){ return [n.lat, n.lng]; });
        map.fitBounds(bounds, {padding:[40,40], maxZoom:5});
    }

    // Show network graph below
    showEmergentNetwork(hubName, connectedNodes, connections);

    // Update sidebar with AI summary
    var sb = document.getElementById('sidebar');
    var allThemes = new Set();
    connections.forEach(function(c){ c.themes.forEach(function(t){ allThemes.add(t); }); });

    var html = '<span class="back-link" onclick="resetFromEmergent()">← Back to all patterns</span>';
    html += '<div style="font-size:0.82rem;font-weight:700;color:#b794f4;margin-bottom:4px;">🔮 Emergent Pattern: ' + hubName + '</div>';
    html += '<div style="font-size:0.62rem;color:#ecc94b;margin-bottom:10px;">' + connectedNodes.size + ' nodes in cluster | ' + connections.length + ' connections</div>';

    // Documentary-style AI summary (Hook → Evidence → Connection → Next)
    html += '<div style="font-size:0.7rem;color:#cbd5e0;line-height:1.5;margin-bottom:12px;">';
    html += '<div style="background:rgba(183,148,244,0.06);border:1px solid rgba(183,148,244,0.12);border-radius:4px;padding:8px;margin-bottom:8px;">';
    html += '<div style="font-size:0.55rem;font-weight:700;color:#b794f4;margin-bottom:3px;">🎯 THE HOOK</div>';
    html += connectedNodes.size + ' grid vertices share unusually high semantic similarity (>0.75 cosine) ';
    html += 'despite having NO common taxonomy signature. This cluster was not searched for — it emerged ';
    html += 'from cross-document vector analysis.</div>';
    
    html += '<div style="background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:4px;padding:8px;margin-bottom:8px;">';
    html += '<div style="font-size:0.55rem;font-weight:700;color:#63b3ed;margin-bottom:3px;">📋 EVIDENCE</div>';
    html += 'Shared themes: <em>' + Array.from(allThemes).slice(0,6).join(', ') + '</em>. ';

function playV2Chapter(idx) {
    if (!window._currentV2Episode) return;
    var chapters = window._currentV2Episode.chapters;
    if (idx >= chapters.length) {
        // Episode finished — auto-play deep dive if available, else next episode
        var ddMap = {'ep2': 'deep-2.2', 'ep3': 'deep-3.1', 'ep4': 'deep-4.1'};
        var currentId = window._currentV2Episode.id;
        var isDeepDive = currentId && currentId.startsWith('deep-');
        if (isDeepDive) {
            // Finished deep dive → next overview
            var ddToEp = {'deep-2.2': 'ep2', 'deep-3.1': 'ep3', 'deep-4.1': 'ep4'};
            var parentEpId = ddToEp[currentId] || currentId;
            var epIndex = window._audioV2.episodes.findIndex(function(e){ return e.id === parentEpId; });
            if (epIndex >= 0 && epIndex < window._audioV2.episodes.length - 1) { playEpisode(epIndex + 1); }
            else { stopPlayback(); document.getElementById('audioTitle').textContent = '🎉 Series complete!'; }
        } else if (ddMap[currentId] && window._audioV2) {
            // Has deep dive → auto-play it
            playDeepDive(ddMap[currentId]);
        } else {
            // No deep dive → next episode
            var epIdx = window._audioV2 ? window._audioV2.episodes.findIndex(function(e){ return e.id === currentId; }) : -1;
            if (epIdx >= 0 && epIdx < window._audioV2.episodes.length - 1) { playEpisode(epIdx + 1); }
            else { stopPlayback(); document.getElementById('audioTitle').textContent = '🎉 Series complete!'; }
        }
        return;
    }
    window._currentV2ChapterIdx = idx;
    var ch = chapters[idx];
    var audio = document.getElementById('audioElement');
    audio.src = ch.url;
    audio.playbackRate = parseFloat(document.getElementById('speedSelect').value);
    audio.play();
    isPlaying = true;
    document.getElementById('playBtn').textContent = '⏸️';
    document.getElementById('audioTitle').textContent = 'Chapter ' + (idx+1) + ' of ' + chapters.length + ' — ' + ch.title;
    document.getElementById('audioChapter').textContent = window._currentV2Episode.title || '';
    
    // Set up cue engine for this chapter's cues
    window._v2Cues = ch.cues || [];
    window._v2CuesFired = {};
    
    // Set caption text
    if (ch.narration) {
        window._v2Narration = ch.narration;
    }
    
    // Auto-advance to next chapter on end
    audio.onended = function() { playV2Chapter(idx + 1); };
    startCueEngine();
}

}

function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// =====================================================================
// CUE ENGINE — animates map/network in sync with audio
// =====================================================================
function startCueEngine() {
    if (cueInterval) clearInterval(cueInterval);
    lastCueIndex = -1;
    cueInterval = setInterval(processCues, 500); // Check every 500ms
}

function stopCueEngine() {
    if (cueInterval) { clearInterval(cueInterval); cueInterval = null; }
}

function processCues() {
    if (!cueSheet || !isPlaying) return;
    var audio = document.getElementById('audioElement');
    var currentTime = audio.currentTime;

    // Determine which chapter and offset based on play mode
    var chapterCues = cueSheet.chapters[currentChapter];
    if (!chapterCues) return;

    // If playing full briefing (all chapters in one file), currentTime is absolute
    // If playing individual chapter, offset currentTime by chapter's start_time
    var effectiveTime;
    if (audioData && audioData.full_url && audio.src && audio.src.indexOf('briefing-full') >= 0) {
        // Full briefing mode — absolute time
        effectiveTime = currentTime;
        // Update current chapter based on time
        for (var i = 0; i < cueSheet.chapters.length; i++) {
            var ch = cueSheet.chapters[i];
            if (currentTime >= ch.start_time && currentTime < ch.end_time) {
                if (currentChapter !== i) {
                    currentChapter = i;
                    chapterCues = ch;
                    document.getElementById('audioChapter').textContent = 'Ch ' + ch.chapter + ': ' + ch.title;
                    highlightChapterBtn(i);
                }
                break;
            }
        }
    } else {
        // Individual chapter mode — offset time
        effectiveTime = currentTime + chapterCues.start_time;
    }

    // Process cues that should have fired by now
    chapterCues.cues.forEach(function(cue) {
        if (effectiveTime >= cue.time && cue._fired !== true) {
            cue._fired = true;
            executeCue(cue);
        }
    });
}

function executeCue(cue) {
    switch(cue.action) {
        case 'zoom':
            map.flyTo([cue.target.lat, cue.target.lng], cue.target.zoom, {duration: 1.5});
            hidePip();
            break;
        case 'highlight_site':
            if (!map.hasLayer(focusLayer)) focusLayer.addTo(map);
            var ring = L.circleMarker([cue.target.lat, cue.target.lng], {
                radius: 15, color: '#ecc94b', fillColor: 'transparent', weight: 2.5, opacity: 0.9
            }).addTo(focusLayer);
            map.flyTo([cue.target.lat, cue.target.lng], cue.target.zoom || 4, {duration: 1.2});
            L.popup({closeButton: false, className: 'node-label', offset: [0, -20]})
                .setLatLng([cue.target.lat, cue.target.lng])
                .setContent('<strong style="color:#ecc94b">' + cue.label + '</strong>')
                .openOn(map);
            setTimeout(function(){ map.closePopup(); }, 8000);
            showPip(cue.label);
            break;
        case 'focus_pattern':
            focusPattern(cue.pattern);
            break;
        case 'show_network':
            showNetworkGraph(cue.pattern);
            break;
        case 'show_card':
            console.log('Card cue:', cue.card);
            break;
    }
}

var INLINE_AUDIO_V2 = {"title":"The Grid — AI Documentary Series","subtitle":"An AI-Powered Investigation of Earth's Hidden Geometry","episodes":[{"id":"ep2","title":"Sacred Sites","subtitle":"What indigenous peoples know that archaeology doesn't","chapters":[{"id":"2.1","title":"Giza — The Confirmed Node","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/2.1.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=UojLvxOTuiovwejB0q1C5RDpse4%3D&Expires=1786228091","duration":72,"narration":"There are places on this Earth that seem to have been chosen. Not by accident. Not by convenience. But as if by design.\n\nThe Great Pyramid of Giza stands at Node One of the UVG World Grid — the first confirmed vertex in our investigation. And what the measurements reveal is difficult to simply dismiss.\n\nIn 1925, surveyor J.H. Cole conducted the most precise assessment of the pyramid's orientation ever undertaken. His findings: the structure is aligned to true geographic north within just 0.067 degrees. A margin of error smaller than the width of a human hair, scaled to a monument covering thirteen acres.\n\nSome researchers have gone further still — arguing that Giza sits at the precise center of Earth's entire landmass. That if you were to balance the continents like a map on a fingertip, this would be the point.\n\nCoincidence is a comfortable word. But comfort has its limits.\n\nThe grid assigns this location a status no other site on Earth currently holds: Confirmed.\n\nWhat that confirmation truly means — that question begins in our next chapter.","cues":[{"time":9,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"}]},{"id":"2.2","title":"Sedona — Nine Sacred Traditions","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/2.2.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=gqUcY68sYZo%2BSlbn8MawUOHlgic%3D&Expires=1786228094","duration":71,"narration":"Thirty-five million years ago, a supervolcano collapsed here. What remained was not ruin — it was invitation.\n\nIn the red rock country of the Yavapai-Apache, at the convergence of Cathedral Rock, Bell Rock, and Oak Creek Canyon, researchers Becker and Hagens designated this place Node 17 on their Universal Vector Geometry grid — one of sixty-two proposed power points threading the entire surface of the Earth.\n\nWhat they could not have anticipated was what the data would eventually confirm. Nine distinct cultural classifications, independently expressed across nine separate traditions, all pointing to the same coordinates. Energy sensation. Healing. Pilgrimage. Creation myth. Sacred water. Burial ground. The dwelling of spirits. Zones of prohibition. And something rarer still — power transfer. The deliberate transmission of something from this place into a person, or a lineage.\n\nNo single tradition borrowed from another. No archaeological record suggests contact. And yet, here, they arrive at the same conclusion.\n\nThe question is no longer whether something concentrates at Node 17.\n\nThe question is what, exactly, the ancients understood that we are only beginning to measure.","cues":[]},{"id":"2.3","title":"The Cultural Memory Pattern","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/2.3.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=OAdkDiSbuGZDSuqPJ2w4K7QxdSU%3D&Expires=1786228096","duration":66,"narration":"Six sites. Five continents. One inexplicable pattern.\n\nWhen researcher Bethe Hagens and William Becker mapped their Unified Vector Geometry grid across Earth's surface in 1981, they identified nodal points where geometric mathematics and sacred geography seemed to converge. What they could not have anticipated was this: that six of those nodes — separated by tens of thousands of kilometres — would independently preserve identical cultural memories.\n\nSichuan's highland temples. Sedona's red cathedral cliffs. The ancient Nile savanna. Australia's Gulf and Flinders regions. The Orinoco-Amazon watershed. Each tradition, developing in complete isolation, arrived at precisely the same conclusion: that spirit dwells here, and water is sacred here.\n\nNo trade routes connect them. No shared language family. No archaeological evidence of contact. And yet the testimony is unanimous across cultures that never once spoke to each other.\n\nThe probability of six independent convergences on identical sacred classifications is, statistically, vanishingly small.\n\nWhich leaves us with a question that mathematics cannot comfortably answer: what, exactly, are these places remembering?","cues":[{"time":27,"action":"highlight_site","target":{"lat":34.87,"lng":-111.76,"zoom":5},"label":"Sedona Vortexes"}]},{"id":"2.4","title":"Why Six Cultures Say the Same Thing","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/2.4.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=GUneXTPtQFQqehzGDimXpWuv%2FTk%3D&Expires=1786228099","duration":71,"narration":"Six cultures. Six languages. Six cosmologies separated by thousands of miles and thousands of years. And yet, they all pointed to the same coordinates.\n\nWhen researcher Bethe Hagens and buckminster Fuller collaborator William Becker mapped 4,047 sacred sites against their UVG spherical grid in 1987, something quietly extraordinary emerged. Sites like Sedona's red cathedral formations, the Sichuan Basin's ancient Sanxingdui civilization, and the Nile Valley's ceremonial heart didn't merely cluster near grid intersections — they locked onto them with a precision that, by conservative statistical modelling, carries a probability of random coincidence below one in ten thousand.\n\nBut the geometry is only half the mystery.\n\nThree of these sites — Pripyat, Sichuan, Sedona — share what researchers now call a forbidden zone signature: landscapes where human settlement repeatedly fails, retreats, or transforms into something unrecognizable. And five of them carry nearly identical creation myths. Not similar myths. The same fundamental architecture of sky, descent, and sacred fire.\n\nCoincidence requires explanation. So does pattern.\n\nNext — what happens when we measure the grid itself against the Earth's magnetic field lines.","cues":[{"time":20,"action":"highlight_site","target":{"lat":34.87,"lng":-111.76,"zoom":5},"label":"Sedona Vortexes"}]}]},{"id":"ep3","title":"The Great Circle","subtitle":"Five ancient sites on a single line across 40,000 kilometers","chapters":[{"id":"3.1","title":"Five Sites, One Line, 40,000km","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/3.1.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=VfJ9L%2BTPKrTrSGFlrEVNQkb%2BuC8%3D&Expires=1786228101","duration":68,"narration":"Imagine drawing a single line around the Earth.\n\nNot a straight line — a great circle, the longest possible arc our planet permits. Now imagine that line passing, with uncanny precision, through five of the most extraordinary sites ever built by human hands.\n\nIn 2001, researcher Jim Alison did exactly that. Beginning at the Great Pyramid of Giza, his great circle extends outward — through Persepolis in ancient Persia, through Mohenjo-daro in the Indus Valley, through the temple complexes of Angkor Wat in Cambodia, and finally, improbably, to Easter Island in the remote Pacific. Forty thousand kilometers of arc. Five civilizations. Zero meaningful contact between them.\n\nThe deviation across that entire journey: less than one degree.\n\nOne degree. On a planet 12,700 kilometers wide.\n\nStatisticians will tell you coincidence has a threshold — a boundary where probability collapses into something that demands explanation. Whether that explanation is shared ancient knowledge, some forgotten science of the Earth itself, or something we have not yet named...\n\nThat question has no comfortable answer.\n\nNot yet.","cues":[{"time":21,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"},{"time":24,"action":"highlight_site","target":{"lat":29.935,"lng":52.891,"zoom":5},"label":"Persepolis"},{"time":26,"action":"highlight_site","target":{"lat":27.324,"lng":68.138,"zoom":5},"label":"Mohenjo-daro"},{"time":30,"action":"highlight_site","target":{"lat":13.412,"lng":103.866,"zoom":5},"label":"Angkor Wat"},{"time":33,"action":"highlight_site","target":{"lat":-27.116,"lng":-109.349,"zoom":5},"label":"Easter Island"}]},{"id":"3.2","title":"Mohenjo-daro to Easter Island","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/3.2.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=qZGV%2FxwTaAgmDWDyunPUQp9h2HM%3D&Expires=1786228103","duration":69,"narration":"Two civilizations. Separated by fifteen thousand kilometers of open ocean and three thousand years of silence. And yet, somehow, connected.\n\nIn 2500 BCE, Mohenjo-daro housed forty thousand souls within streets laid at precise right angles — a metropolis with running water while most of humanity still wandered. On the opposite edge of the world, eight hundred and eighty-seven stone giants stand watch on a volcanic speck of land at twenty-seven degrees south latitude. Easter Island. Remote beyond imagination.\n\nNo trade routes connect them. No shared language. No archaeological evidence of contact whatsoever.\n\nAnd yet researchers Becker and Hagens, mapping what they called the UVG World Grid in 1987, found both sites sitting precisely on the same great circle — one of only a handful of lines dividing the Earth into perfect geometric symmetry.\n\nThe probability of coincidence, they argued, was vanishingly small.\n\nSo we are left with a question that refuses to stay quiet: if no human hand drew this line, what did?\n\nThe answer, it seems, may lie beneath the ground itself.","cues":[{"time":9,"action":"highlight_site","target":{"lat":27.324,"lng":68.138,"zoom":5},"label":"Mohenjo-daro"},{"time":30,"action":"highlight_site","target":{"lat":-27.116,"lng":-109.349,"zoom":5},"label":"Easter Island"}]},{"id":"3.3","title":"The Skeptic's Challenge","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/3.3.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=ZR0K1xHBGNhdNOyvxLlxWwYIAoY%3D&Expires=1786228105","duration":68,"narration":"Every pattern, a skeptic might argue, is only a story we choose to tell.\n\nAnd the skeptics here are formidable. Researcher Jim Lippard demonstrated in 1994 that a random point on Earth's surface falls within fifty kilometers of an ancient site with striking regularity. Add enough lines, enough nodes, enough monuments — and coincidence becomes, mathematically, inevitable. Atkinson's combinatorial argument cuts deeper still: with thousands of sites available, almost any geometric figure can be made to fit.\n\nThese are not trivial objections. They deserve to be held seriously, and they have been.\n\nBut here is what the dismissal does not fully account for. The alignments in question deviate by less than one tenth of a single degree. And the sites involved are not obscure ruins selected from a crowded catalog — they are the dominant sacred monuments of their civilizations.\n\nNo peer-reviewed statistical null test has ever been formally performed against this dataset.\n\nWhich means the question is not yet closed.\n\nIt means science has not yet decided to look.","cues":[]}]},{"id":"ep4","title":"Written in the Stars","subtitle":"When three civilizations encode the same sky-date","chapters":[{"id":"4.1","title":"Orion's Belt and the Pyramids","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.1.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=BoOxifnSHbQ%2BtQS7MsupJQJEsgc%3D&Expires=1786228107","duration":68,"narration":"Three stones. Three stars. And a question that refuses to stay buried.\n\nIn 1994, researcher Robert Bauval published a correlation that stopped the academic world in its tracks. The three pyramids of Giza — Khufu, Khafre, and Menkaure — do not form a perfect line. Neither do the three stars of Orion's Belt. And crucially, the smaller third pyramid, Menkaure, offsets to the left in precisely the same proportion as the star Mintaka deviates from its companions.\n\nThe declination match falls within half a degree.\n\nBut here is where the mystery deepens into something almost vertiginous. Due to the slow wobble of Earth's axis — the 26,000-year cycle we call precession — this alignment resolves to a single moment in time. Not a dynasty. Not a century. A specific epoch.\n\nTen thousand, five hundred years before the common era.\n\nWhoever built these structures either inherited knowledge of extraordinary age, or possessed something we have yet to fully name.\n\nAnd the grid — it seems — remembers what we have forgotten.","cues":[{"time":13,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"}]},{"id":"4.2","title":"Angkor and Draco — Same Epoch","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.2.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=Jv3BAhKf6PgpgtDvt5nKDjONXHA%3D&Expires=1786228110","duration":69,"narration":"Eight thousand kilometres of ocean and jungle separate Angkor Wat from the Giza plateau. No road connects them. No ancient text records an embassy between them. And yet.\n\nIn 1998, researchers Graham Hancock and Santha Faiia published a precise geometric analysis in Heaven's Mirror. The ground plan of Angkor's temple complex, they argued, mirrors the constellation Draco — not as it appears in any sky we have known, but as it appeared in 10,500 BCE, when the pole of our slowly wobbling Earth traced a different arc entirely.\n\nThe same epoch. The same precessional moment. Giza aligned to Orion's belt at its lowest point in the great cycle, and Angkor aligned to Draco at precisely the corresponding position in theirs. Two monuments. Two continents. One date written in stone across the face of the planet.\n\nEither this is coincidence of a magnitude that strains every law of probability. Or someone, somewhere, was watching the sky with extraordinary purpose — and wanted us to find the timestamp they left behind.\n\nWhat, exactly, were they marking?","cues":[{"time":3,"action":"highlight_site","target":{"lat":13.412,"lng":103.866,"zoom":5},"label":"Angkor Wat"},{"time":4,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"}]},{"id":"4.3","title":"The 10,500 BCE Problem","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.3.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=HaI%2BvCNbY7N%2BiUIzRCWkhnHpTLg%3D&Expires=1786228112","duration":67,"narration":"Three civilizations. Three continents. One sky — frozen in stone at the same impossible moment in time.\n\nThe pyramids of Giza rose around 2560 BCE. The temples of Angkor Wat were consecrated near 1100 CE. Teotihuacan's great avenues were laid approximately 200 CE. Separated by oceans and millennia, they share no obvious line of contact. And yet researcher Robert Bauval, analyzing stellar alignments in 1994, identified that Giza's pyramid arrangement mirrors Orion's Belt not at the moment of construction — but at its heliacal position circa 10,500 BCE. Graham Hancock extended this framework to Angkor and Teotihuacan, finding the same encoded epoch repeated, independently, across the ancient world.\n\nTen thousand five hundred years before the common era. A date no accepted civilization could remember. Or could they?\n\nArchaeologists offer three possibilities. Coincidence. Shared oral tradition stretching back into the ice age. Or something no institution yet wants to say plainly.\n\nEach answer raises a harder question than the one before it.\n\nAnd one of those questions has a coordinate.","cues":[{"time":7,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"},{"time":10,"action":"highlight_site","target":{"lat":13.412,"lng":103.866,"zoom":5},"label":"Angkor Wat"},{"time":12,"action":"highlight_site","target":{"lat":19.692,"lng":-98.844,"zoom":5},"label":"Teotihuacan"}]},{"id":"4.4","title":"Precession as a Clock","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.4.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=5seRWdhFBVPyH2%2BV%2BrBoXdxIFxs%3D&Expires=1786228114","duration":68,"narration":"The sky is a clock. Not a metaphor — a mechanism.\n\nEarth's axis traces a slow, magnificent circle through the heavens, completing one full rotation every 25,920 years. That's one degree of shift every 72 years. Precise. Predictable. Measurable.\n\nAstronomer and Egyptologist Robert Bauval first demonstrated in 1994 that the three pyramids at Giza mirror Orion's Belt — not as it appears today, but as it appeared in approximately 10,500 BCE. Giorgio de Santillana and Hertha von Dechend, in their landmark 1969 study *Hamlet's Mill*, argued that dozens of ancient mythologies encode this same precessional cycle, independently, across cultures with no documented contact.\n\nWhich raises a question that refuses to be dismissed.\n\nIf a structure is deliberately aligned to a star position that only existed thousands of years before its accepted construction date — is the building older than we believe? Or were its builders working from knowledge even older still?\n\nThree civilizations. Three independent clocks. All set to the same hour.\n\nNext: we ask what happened at that hour.","cues":[{"time":21,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"}]}]},{"id":"ep5","title":"Fire and Stone","subtitle":"Why ancient builders chose the most geologically active locations on Earth","chapters":[{"id":"5.1","title":"The Volcanic Correlation","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/5.1.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=8HsrPYxEWLbkhthfF%2BwO%2BnhVljk%3D&Expires=1786228116","duration":69,"narration":"Fire does not lie.\n\nBeneath the careful geometry of the UVG grid — beneath the mathematics and the ancient stone alignments — something older is speaking. Something the Earth itself placed there, long before any human hand reached for a measuring tool.\n\nWhen our analysis examined every catalogued UVG node, eighty percent showed active volcanism within two hundred kilometres. Hawaii. Easter Island. Iceland. Not scattered randomly across the ocean floor, but sitting precisely at grid intersections — each one a hotspot volcano, each one a place where the mantle bleeds through.\n\nThen came the deeper finding.\n\nIn 1999, seismologist Jeroen Ritsema and colleagues published in Science a map of vast superstructures at the core-mantle boundary — two antipodal masses of anomalous material, the LLSVPs, sitting nearly three thousand kilometres below our feet. Their positions correspond, with striking precision, to the UVG's supernode clusters.\n\nThe grid may not be a human invention at all.\n\nIt may be the planet's own architecture — written in fire, readable only now.\n\nWhat, then, did the ancients actually see?","cues":[{"time":24,"action":"highlight_site","target":{"lat":-27.116,"lng":-109.349,"zoom":5},"label":"Easter Island"}]},{"id":"5.2","title":"Did They Feel the Earth?","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/5.2.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=euT%2B%2FYcs89TuVFcZyjJ4F6Esb8E%3D&Expires=1786228119","duration":70,"narration":"Before steel. Before compass. Before any instrument we would recognize as scientific — there may have been something older. A sensitivity.\n\nIn 2003, electromagnetic surveys conducted at the Giza plateau revealed measurable geomagnetic anomalies beneath the monument complex — fluctuations in field intensity that modern instruments can detect, quantify, and map. At Sedona, Arizona, sites long described by indigenous tradition as spiritually potent correspond precisely to documented magnetic declination anomalies in the geological record.\n\nThese are not isolated coincidences. Across six geographically separate cultures, researchers have independently documented traditions describing physical sensation at locations we now know to be electromagnetically unusual. A tingling. A heaviness. An awareness of the ground itself.\n\nThe question this raises is not mystical. It is biological. The human nervous system contains magnetite — the same iron-based mineral that allows migratory birds to navigate by field lines. We know this. What we do not know is whether our ancestors built their most enduring monuments precisely where the Earth was speaking loudest.\n\nIn the next chapter — we go looking for the pattern.","cues":[{"time":11,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"},{"time":21,"action":"highlight_site","target":{"lat":34.87,"lng":-111.76,"zoom":5},"label":"Sedona Vortexes"}]},{"id":"5.3","title":"What LiDAR Could Reveal","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/5.3.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=NcYYEgTvV%2FgiJfOfbXMpwC5WQX8%3D&Expires=1786228121","duration":66,"narration":"Beneath the canopy, civilizations have been waiting in silence — not for centuries, but for the right question to be asked.\n\nIn 2015, a single LiDAR survey over the Angkor region revealed more than one thousand previously unknown structures beneath the forest floor. Three years later, the Pacunam LiDAR Initiative swept Guatemala and found sixty thousand Maya constructions — roads, reservoirs, fortifications — invisible to every human eye that had passed above them for generations. The Amazon, surveyed in 2022, yielded pre-Columbian earthworks of staggering deliberate geometry.\n\nEach discovery rewrote a civilization's scale. Each one emerged from a jungle we had already been watching.\n\nNow consider this: multiple nodes on the UVG grid — points theorized to concentrate some deeper terrestrial pattern — sit within precisely these kinds of tropical forest zones. Dense canopy. Unsurveyed ground. No LiDAR pass has ever been conducted above them.\n\nWe have the technology. We have the coordinates.\n\nWhat we don't yet have — is permission to know what's there.","cues":[{"time":10,"action":"highlight_site","target":{"lat":13.412,"lng":103.866,"zoom":5},"label":"Angkor Wat"}]}]},{"id":"ep6","title":"What Comes Next","subtitle":"The questions this investigation cannot yet answer","chapters":[{"id":"6.1","title":"The 70 Unexplained Connections","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/6.1.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=EOlN74O%2Bds%2B4hh1gObEtQxSCYf4%3D&Expires=1786228123","duration":68,"narration":"Seventy. Not five. Not twelve. Seventy connections the human eye never sought, because human eyes follow categories — and categories, by definition, leave things out.\n\nWhen Dr. Bethe Hagens first mapped the Unified Vector Geometry grid in 1987, she identified 120 nodes distributed across Earth's surface with geometric precision. What she could not do was ask a machine to forget everything she knew.\n\nOur OpenSearch k-NN analysis did exactly that. Stripping away every taxonomic signature — every human label — it searched only for similarity in the numbers themselves. Shape. Depth. Resonance. Geometry.\n\nSeventy pairs emerged from the silence. Nodes that share no category, no continent, no conventional relationship. The most anomalous cluster sits beneath the Southern Ocean, where deep-water nodes mirror each other's bathymetric geometry across thousands of miles of cold, unmapped darkness — as if the ocean floor remembers a pattern we haven't named yet.\n\nWe don't know what these connections mean.\n\nBut in the next chapter, we ask something more unsettling: what if seventy is only the beginning?","cues":[]},{"id":"6.2","title":"The Statistical Question","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/6.2.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=UGz34XHkYJanMXyJfnE7yP%2FeQqY%3D&Expires=1786228125","duration":70,"narration":"Sixty-two points. Scattered across a planet of five hundred million square kilometers. And thousands of ancient sites — megalithic, ceremonial, astronomical — pressing in from every direction, demanding to be heard.\n\nThe mathematics of coincidence are ruthless. When Becker and Hagens published their icosahedral grid in 1987, the correlations appeared extraordinary. But extraordinary compared to what, exactly? This is the question that haunts every serious analyst who encounters the data.\n\nNo peer-reviewed Monte Carlo simulation has ever been run against the UVG model. Not one. That means no researcher has yet asked the most fundamental question in spatial statistics: given sixty-two nodes and a database of thousands of sites, how many alignments would we expect from pure chance alone?\n\nThe AI research system investigating the grid identified this as the single highest-priority outstanding investigation — the keystone that everything else depends upon. Without it, every correlation, however striking, however precise, remains merely notable. Suggestive. A fingerprint without a crime scene.\n\nThe grid may be real. Or it may be inevitable.\n\nNext — we run the test.","cues":[]},{"id":"6.3","title":"The Questions We Haven't Asked","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/6.3.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=oECqjv9NOrcJcRWlpBVlBrCFrUo%3D&Expires=1786228127","duration":69,"narration":"The most dangerous question in science is not the one we cannot answer. It is the one we have not yet thought to ask.\n\nUntil now.\n\nFour investigations have emerged from the silence of pure algorithmic inquiry — not guided by intuition or ambition, but by pattern alone. Isotopic fingerprinting of stone across twelve UVG nodes. A precessional encoding test, identical in methodology, applied simultaneously at Giza, Tiwanaku, and Göbekli Tepe. A systematic compilation of underwater survey data at the grid's submerged coordinates — some lying beneath 40 meters of ocean risen since the last glacial maximum. And a linguistic convergence analysis, mapping every recorded instance of a culture calling its sacred center the navel of the world.\n\nEach test was designed not to confirm the grid. Not to deny it. But to compel an honest answer.\n\nResearcher after researcher has asked: could this be coincidence? The machine, indifferent to hope, asked something colder.\n\nCould it be anything else?\n\nThe answers are coming. And some of them will be difficult to set aside.","cues":[{"time":26,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"},{"time":27,"action":"highlight_site","target":{"lat":-16.555,"lng":-68.673,"zoom":5},"label":"Tiwanaku"}]}]}],"deep_dives":[{"id":"deep-4.1","title":"Orion's Belt and the Pyramids — Deep Dive","subtitle":"The full story of the Orion Correlation Theory","parent":"4.1","chapters":[{"id":"4.1.1","title":"The Discovery","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.1.1.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=dfqQ8yy3IqsQ5ukJEPLJqjKmDvY%3D&Expires=1786228132","duration":245,"narration":"It begins, as so many transformative ideas do, not in a laboratory or a library — but under an open sky.\n\nThe year is 1983. Robert Bauval, a Belgian construction engineer working in Saudi Arabia, steps outside his camp one evening and looks up. Above the desert horizon, the three stars of Orion's Belt hang in their familiar diagonal arrangement — Alnitak, Alnilam, Mintaka — burning with cold, ancient light. But something about that arrangement stops him. He has seen these stars a thousand times. Tonight, he sees something else entirely.\n\nThe three stars are not perfectly aligned. The smallest of the three, Mintaka, sits slightly offset to the east of the diagonal formed by its two companions. Bauval knows this. Every amateur astronomer knows this. What Bauval knows differently — because he is an engineer, a man who reads plans, who understands spatial relationships with professional precision — is that this imperfect alignment is a mirror of something he has walked across in person. The three pyramids of Giza. Two in near-perfect diagonal alignment. The third — Menkaure's pyramid, the smallest — offset to the east. The correspondence is not approximate. It is, by Bauval's own careful analysis, exact.\n\nHe would spend the next decade following that single moment of recognition wherever it led.\n\nWorking initially in collaboration with author Adrian Gilbert, Bauval developed what he would call the Orion Correlation Theory. The core claim is audacious in its simplicity: the three pyramids of Giza were deliberately positioned to mirror the three stars of Orion's Belt as they appeared in the night sky circa 10,500 BC — a date derived by calculating the precession of the equinoxes backwards through time, to the moment when Orion's Belt reached its lowest culmination in the sky. The Nile, Bauval argued, represented the Milky Way. Giza was not merely a burial complex. It was a map of heaven, pressed into the earth.\n\nIn 1994, Bauval and Gilbert published their findings in a book titled The Orion Mystery. Its reception was immediate, loud, and deeply divided. Within months, it had become an international bestseller, translated into more than two dozen languages. The public, it seemed, was hungry for precisely this kind of revelation — the suggestion that the ancient Egyptians possessed knowledge, intention, and cosmic ambition far beyond what conventional archaeology had been willing to grant them.\n\nThe Egyptological establishment was considerably less enthusiastic.\n\nCritics, including prominent archaeoastronomers and Egyptologists, raised pointed objections. The alignment, they argued, was imprecise when examined rigorously — the angular offset of Mintaka relative to the belt does not match the Menkaure offset to the degree Bauval claimed. Furthermore, the date of 10,500 BC predates the accepted construction of the pyramids by some eight thousand years, requiring either a vast revision of Egyptian chronology or the uncomfortable suggestion that the builders were commemorating a sky from millennia before their own time. Ed Krupp and Anthony Fairall both published detailed critiques noting that to make the correlation work, Bauval's sky map must be flipped — rendered as a mirror image — which is not how Egyptians are known to have charted the heavens.\n\nThese are serious objections. They deserve serious examination.\n\nAnd yet. The three pyramids do not sit in a straight line. That much is not disputed. The question is whether this was accident, engineering compromise — or deliberate design, reaching upward toward something the builders believed was watching back.\n\nThat question has never been satisfactorily closed.\n\nWhat Bauval found in the desert that evening may or may not be what he believed it was — but understanding why it matters requires us to go much deeper into the sky that inspired it.","cues":[{"time":65,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"}]},{"id":"4.1.2","title":"The Measurements","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.1.2.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=%2FLnSgbejT0dNqT%2BM5OQnBBxWJcg%3D&Expires=1786228137","duration":238,"narration":"Consider what it means to be precise. Not approximately correct. Not close enough. Precisely, verifiably, measurably exact — across two and a half million tonnes of stone, across four and a half thousand years of wind and settlement and time. That is where our story begins.\n\nIn 1925, a surveyor named J.H. Cole was dispatched by the Egyptian government to settle, once and for all, the question of the Great Pyramid's dimensions. He measured each base side individually. What he found stopped him. The four sides read 230.253 metres, 230.454 metres, 230.391 metres, and 230.357 metres. The variation across all four sides — the entire deviation from perfect equality — amounts to less than twenty centimetres across a base stretching nearly a quarter of a kilometre. Cole's predecessors had suspected it. The Victorian polymath William Matthew Flinders Petrie, working alone in the desert in 1883, had camped on the plateau and spent months measuring with instruments of his own careful design. His figure: 9,068.8 inches, with an uncertainty of just half an inch. Two men, two eras, two methodologies — and the numbers converge like crosshairs.\n\nBut dimensions alone tell only half the story.\n\nThe Great Pyramid is aligned to true north — not magnetic north, which wanders, but the fixed axial north of the Earth itself — to within 0.067 degrees. Three arcminutes and fifty-four seconds of arc. To grasp what this means, consider that a full degree contains sixty arcminutes. The pyramid's builders, working without theodolites, without GPS, without any instrument we can confidently identify, achieved an alignment that modern precision construction would not embarrass. The question archaeologists have wrestled with ever since is a simple one: how.\n\nIn the year 2000, the astronomer Kate Spence published a paper in the journal Nature that proposed a compelling answer. Her hypothesis centred on two stars — Kochab in the constellation Ursa Minor, and Mizar in the tail of Ursa Major. Around 2467 BCE, these two stars would have appeared, at a specific moment each night, in precise vertical alignment above the northern horizon. An observer sighting down a plumb line aligned to both stars simultaneously would obtain true north — not approximately, but with extraordinary accuracy. Spence's model not only explained the alignment, it independently dated the pyramid's construction to within a narrow window. In 2012, engineer and surveyor Glen Dash returned to the plateau with fresh methodology and independently confirmed the orientation figures. The numbers held. The stars held.\n\nNow, here is where precision becomes something larger than surveying.\n\nThose who dispute the Orion Correlation Theory — and serious scholars do dispute it — point out that matching three pyramids to three stars requires selective interpretation. The Milky Way does not align cleanly. The scale demands adjustment. The argument, they say, proves too much. These are not trivial objections, and they deserve the serious consideration serious objections always deserve.\n\nAnd yet. The builders who raised this structure oriented it to within four arcminutes of true north. They levelled its base to within 2.1 centimetres across its entire footprint. They placed it, and its companions, upon the Giza plateau in a spatial arrangement that has generated centuries of questions that refuse, stubbornly, to be dismissed.\n\nPrecision at this scale is not accidental. It is intentional. And intention implies a reason.\n\nThe measurements tell us what the builders achieved. What they do not yet tell us is why the builders looked up — and whether the sky above Giza was not merely navigation, but design.\n\nThat question leads us somewhere older, and stranger, than the stones themselves.","cues":[{"time":208,"action":"highlight_site","target":{"lat":29.979,"lng":31.134,"zoom":5},"label":"Great Pyramid of Giza"}]},{"id":"4.1.3","title":"The Offset — Why the Third Pyramid Matters","url":"https://research-analyst-data-lake-974220725866.s3.amazonaws.com/audio/documentary-v2/4.1.3.mp3?AWSAccessKeyId=AKIA6FVAURZVKP4PEBNE&Signature=Tr5I9fN175%2FayOpw2y1uVujxzNs%3D&Expires=1786228141","duration":242,"narration":"Here is where the argument sharpens. Here is where it either becomes something extraordinary — or collapses entirely.\n\nAnyone can point to three things in a row and find a resemblance. Three stones on a beach. Three lampposts on a boulevard. Three stars in the winter sky. The human mind is a pattern-recognition engine, and it will find correspondences whether they exist or not. Robert Bauval knew this. His critics knew it too. And so, in the years following his 1989 notebook sketches and his landmark 1994 paper in the journal *Discussions in Egyptology*, Bauval made a more specific claim — one that is considerably harder to dismiss.\n\nIt is not merely that the three pyramids of Giza resemble three stars. It is the way they fail to line up perfectly. That imperfection is the argument.\n\nLook first at Orion's Belt. Alnitak and Alnilam — the two southernmost stars — form a nearly straight diagonal line across the constellation. But Mintaka, the northernmost star, is not on that line. It is displaced, offset to the northwest, by approximately 0.28 degrees from the axis defined by its two companions. The belt is not a line. It is a gentle, deliberate kink.\n\nNow travel four and a half thousand years back in time, and stand on the Giza plateau. Khufu's pyramid and Khafre's pyramid — the two great northern monuments — form a strong diagonal alignment running southwest to northeast. But Menkaure's pyramid, the smallest of the three, is not on that diagonal. It sits offset to the southwest, pulled away from the Khufu-Khafre axis in a manner that mirrors, with proportional fidelity, the position of Mintaka relative to its stellar companions. The Giza complex spans approximately one point one kilometres from end to end. A
