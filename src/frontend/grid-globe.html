function renderComparisonView(metrics, constellation) {
    var c = STAR_CATALOG[_celestialConstellation];
    if (!c) return;
    
    var svgEl = document.getElementById('alignmentSvg');
    if (!svgEl) return;
    var svg = d3.select('#alignmentSvg');
    svg.selectAll('*').remove();
    
    var w = svgEl.clientWidth || 450;
    var h = svgEl.clientHeight || 260;
    svg.attr('viewBox', '0 0 ' + w + ' ' + h);
    
    // --- LAYOUT: Top half = Sky, Bottom half = Ground, Horizon line in middle ---
    var horizonY = h * 0.45; // Horizon line position
    var skyCenter = horizonY * 0.5; // Center of sky area
    var groundCenter = horizonY + (h - horizonY) * 0.5; // Center of ground area
    
    // Background gradient: dark sky above, darker earth below
    // Sky: use a real star photo as background pattern (simulated with random stars)
    svg.append('rect').attr('x',0).attr('y',0).attr('width',w).attr('height',horizonY)
        .attr('fill','#020408');
    svg.append('rect').attr('x',0).attr('y',horizonY).attr('width',w).attr('height',h-horizonY)
        .attr('fill','#0c1420');
    
    // Scatter realistic background stars (makes it look like a real night sky photo)
    for (var si = 0; si < 80; si++) {
        var sx = Math.random() * w;
        var sy = Math.random() * (horizonY - 10) + 5;
        var sr = Math.random() * 1.2 + 0.3;
        var so = Math.random() * 0.5 + 0.1;
        svg.append('circle').attr('cx', sx).attr('cy', sy).attr('r', sr)
            .attr('fill', '#fff').attr('opacity', so);
    }
    // Milky Way glow band (subtle diagonal wash)
    svg.append('ellipse').attr('cx', w*0.4).attr('cy', horizonY*0.5)
        .attr('rx', w*0.6).attr('ry', horizonY*0.25)
        .attr('fill', 'rgba(200,180,255,0.015)').attr('transform', 'rotate(-20 '+w*0.4+' '+horizonY*0.5+')');
    
    // Ground: subtle terrain texture (sand/earth tone)
    svg.append('rect').attr('x',0).attr('y',horizonY).attr('width',w).attr('height',h-horizonY)
        .attr('fill','url(#groundGrad)').attr('opacity', 0.3);
    var defs = svg.append('defs');
    var grad = defs.append('linearGradient').attr('id','groundGrad').attr('x1','0%').attr('y1','0%').attr('x2','0%').attr('y2','100%');
    grad.append('stop').attr('offset','0%').attr('stop-color','#1a1408');
    grad.append('stop').attr('offset','100%').attr('stop-color','#0d0a04');
    
    // Horizon line with glow
    svg.append('line').attr('x1',0).attr('y1',horizonY).attr('x2',w).attr('y2',horizonY)
        .attr('stroke','rgba(246,173,85,0.15)').attr('stroke-width',3);
    svg.append('line').attr('x1',0).attr('y1',horizonY).attr('x2',w).attr('y2',horizonY)
        .attr('stroke','rgba(246,173,85,0.5)').attr('stroke-width',1);
    
    // Labels for zones
    svg.append('text').attr('x',12).attr('y',16)
        .attr('fill','rgba(255,255,255,0.4)').attr('font-size','9px').attr('font-weight','600').text('★ NIGHT SKY ('+document.getElementById('epochLabel').textContent+')');
    svg.append('text').attr('x',12).attr('y',horizonY+14)
        .attr('fill','rgba(72,187,120,0.5)').attr('font-size','9px').attr('font-weight','600').text('🏛️ GROUND (Giza Plateau)');
    // TODO: Celestial Viewer v2 improvements needed:
    // 1. Orion's Belt is NOT a straight line — Mintaka is offset north. Must use actual Dec offsets for Y positioning
    // 2. Pyramids should show their actual ground-plan offset (Menkaure offset from Khufu-Khafre line)
    // 3. Need real star field photo or higher-quality procedural starfield
    // 4. Consider 3D perspective view (Three.js) for true sky-to-ground visualization
    // 5. The "wow" factor needs work — consider animated precession playback, or AR-style overlay
    // 6. Bauval's key insight: the OFFSET of the third star matches the OFFSET of the third pyramid
    
    // --- BELT STARS (positioned in sky area based on ACTUAL precessed RA) ---
    var beltIndices = c.belt || [0, 1, 2];
    var beltStars = beltIndices.map(function(i) { return c.stars[i]; });
    
    var precBelt = beltStars.map(function(star) {
        return {
            ra: precessRA(star.ra, star.dec, _celestialEpoch),
            dec: precessDec(star.ra, star.dec, _celestialEpoch),
            name: star.name
        };
    });
    var avgRA = precBelt.reduce(function(s,p){return s+p.ra;},0) / precBelt.length;
    
    // Stars positioned by their RELATIVE RA offset (changes with precession!)
    // At optimal epoch, these should line up with the ground sites
    var raRange = 0;
    precBelt.forEach(function(p) { raRange = Math.max(raRange, Math.abs((p.ra - avgRA) * 15)); });
    if (raRange < 0.5) raRange = 0.5;
    var xScale = (w - 100) / (raRange * 3);
    
    var starPositions = precBelt.map(function(p) {
        var x = w/2 + (p.ra - avgRA) * 15 * xScale;
        var y = skyCenter + (p.dec - precBelt[1].dec) * 8;
        return {x: x, y: Math.max(20, Math.min(horizonY - 20, y)), name: p.name};
    });
    
    // Draw constellation line between belt stars (in sky)
    for (var i = 0; i < starPositions.length - 1; i++) {
        svg.append('line')
            .attr('x1', starPositions[i].x).attr('y1', starPositions[i].y)
            .attr('x2', starPositions[i+1].x).attr('y2', starPositions[i+1].y)
            .attr('stroke', c.color).attr('stroke-width', 2).attr('stroke-opacity', 0.7);
    }
    
    // Draw stars with dramatic glow effect (like a real astrophotography image)
    starPositions.forEach(function(s) {
        // Large diffuse glow
        svg.append('circle').attr('cx', s.x).attr('cy', s.y).attr('r', 22)
            .attr('fill', 'rgba(246,173,85,0.06)');
        svg.append('circle').attr('cx', s.x).attr('cy', s.y).attr('r', 14)
            .attr('fill', 'rgba(246,173,85,0.12)');
        svg.append('circle').attr('cx', s.x).attr('cy', s.y).attr('r', 8)
            .attr('fill', 'rgba(255,255,255,0.15)');
        // Bright core
        svg.append('circle').attr('cx', s.x).attr('cy', s.y).attr('r', 4)
            .attr('fill', '#fff').attr('stroke', c.color).attr('stroke-width', 2);
        // Cross-spike (like real star photos)
        svg.append('line').attr('x1', s.x-12).attr('y1', s.y).attr('x2', s.x+12).attr('y2', s.y)
            .attr('stroke', 'rgba(255,255,255,0.3)').attr('stroke-width', 0.5);
        svg.append('line').attr('x1', s.x).attr('y1', s.y-12).attr('x2', s.x).attr('y2', s.y+12)
            .attr('stroke', 'rgba(255,255,255,0.3)').attr('stroke-width', 0.5);
        // Label
        svg.append('text').attr('x', s.x).attr('y', s.y - 18)
            .attr('text-anchor', 'middle').attr('fill', '#fff')
            .attr('font-size', '10px').attr('font-weight', '700')
            .attr('style', 'text-shadow: 0 0 6px rgba(246,173,85,0.8)')
            .text(s.name);
    });
    
    // --- GROUND SITES (positioned by actual geographic offset — FIXED regardless of epoch) ---
    var sites = PYRAMID_SITES[_celestialConstellation] || [];
    if (sites.length === 0) {
        sites = [{name:"Site", lat:_celestialProjCenter.lat, lng:_celestialProjCenter.lng}];
    }
    
    var siteCenterLng = sites.reduce(function(s,p){return s+p.lng;},0) / sites.length;
    var sitePositions = sites.map(function(s) {
        var x = w/2 + (s.lng - siteCenterLng) * xScale * 0.8;
        var y = groundCenter;
        return {x: x, y: y, name: s.name};
    });
    
    // Draw ground sites as pyramids (sand-colored, more prominent)
    sitePositions.forEach(function(s) {
        var sz = 12;
        // Shadow
        svg.append('polygon')
            .attr('points', (s.x+2)+','+(s.y-sz+2)+' '+(s.x-sz*1.2+2)+','+(s.y+sz*0.6+2)+' '+(s.x+sz*1.2+2)+','+(s.y+sz*0.6+2))
            .attr('fill', 'rgba(0,0,0,0.3)');
        // Pyramid shape (sand/gold tone)
        svg.append('polygon')
            .attr('points', (s.x)+','+(s.y-sz)+' '+(s.x-sz*1.2)+','+(s.y+sz*0.6)+' '+(s.x+sz*1.2)+','+(s.y+sz*0.6))
            .attr('fill', 'rgba(210,180,100,0.4)').attr('stroke', '#d4a843').attr('stroke-width', 1.5);
        // Label
        svg.append('text').attr('x', s.x).attr('y', s.y + sz + 12)
            .attr('text-anchor', 'middle').attr('fill', '#d4a843')
            .attr('font-size', '9px').attr('font-weight', '700')
            .text(s.name.replace('Pyramid of ','').replace('Great Pyramid (','').replace(')',''));
    });
    
    // --- VERTICAL ALIGNMENT LINES (star → site, crossing horizon) ---
    starPositions.forEach(function(star, i) {
        if (i >= sitePositions.length) return;
        var site = sitePositions[i];
        var dist = metrics[i] ? metrics[i].distKm : '?';
        var isLocked = metrics[i] && metrics[i].isLocked;
        var isClose = metrics[i] && metrics[i].distKm < 200;
        var color = isLocked ? '#ecc94b' : isClose ? '#48bb78' : '#f6ad55';
        
        // Vertical dashed line from star down through horizon to site
        svg.append('line')
            .attr('x1', star.x).attr('y1', star.y + 8)
            .attr('x2', site.x).attr('y2', site.y - 12)
            .attr('stroke', color).attr('stroke-width', isLocked ? 2.5 : 1.5)
            .attr('stroke-dasharray', isLocked ? 'none' : '5,4')
            .attr('stroke-opacity', isLocked ? 0.9 : 0.6);
        
        // Distance label at horizon crossing
        var labelY = horizonY + (isLocked ? -12 : 0);
        svg.append('rect')
            .attr('x', (star.x + site.x)/2 - 22).attr('y', labelY - 7)
            .attr('width', 44).attr('height', 14).attr('rx', 3)
            .attr('fill', isLocked ? 'rgba(236,201,75,0.2)' : 'rgba(0,0,0,0.6)')
            .attr('stroke', color).attr('stroke-width', 0.5);
        svg.append('text')
            .attr('x', (star.x + site.x)/2).attr('y', labelY + 4)
            .attr('text-anchor', 'middle').attr('fill', color)
            .attr('font-size', '9px').attr('font-weight', '700')
            .text(dist + ' km');
        
        // Lock icon for perfect alignments
        if (isLocked) {
            svg.append('text')
                .attr('x', (star.x + site.x)/2).attr('y', labelY - 14)
                .attr('text-anchor', 'middle').attr('fill', '#ecc94b')
                .attr('font-size', '12px').text('🔒');
        }
    });
    
    // --- TITLE ---
    svg.append('text').attr('x', w/2).attr('y', h - 8)
        .attr('text-anchor', 'middle').attr('fill', 'rgba(255,255,255,0.3)')
        .attr('font-size', '8px')
        .text('Stars drop vertically to ground — perfect alignment = straight line = 0 km offset');
}
