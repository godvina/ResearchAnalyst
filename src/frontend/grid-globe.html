// =====================================================================
// INIT

async function init() {
    map = L.map('map', {minZoom:2, maxZoom:10, worldCopyJump:true}).setView([20, 20], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution:'OpenStreetMap, CARTO', subdomains:'abcd', maxZoom:18
    }).addTo(map);

    gridLayer = L.layerGroup().addTo(map);
    siteLayer = L.layerGroup().addTo(map);
    focusLayer = L.layerGroup();
    leyLineLayer = L.layerGroup();

    // Load data
    await loadGridNodes();
    await loadResearch();
    await loadScored();

    // Render
    drawGrid();
    drawSites();
    renderSidebar();
    addMapControls();

    // URL param: pre-toggle ley lines
    if (location.search.indexOf('leylines=1') >= 0) toggleLeyLines();
}

async function loadGridNodes() {
    try {
        var r = await fetch(API_BASE + '/nodes');
        if (r.ok) { var d = await r.json(); allNodes = d.nodes || []; return; }
    } catch(e) {}
    // Fallback
    try { var r2 = await fetch('../data/uvg-grid-investigation-database.json'); if(r2.ok){var d2=await r2.json();allNodes=d2.nodes||[];} } catch(e){}
}
async function loadResearch() {
    try { var r = await fetch(API_BASE + '/research'); if(r.ok){researchData=await r.json();return;} } catch(e){}
    try { var r2 = await fetch('../data/uvg-grid-research-all-nodes.json'); if(r2.ok){researchData=await r2.json();} } catch(e){}
}
async function loadScored() {
    try { var r = await fetch(API_BASE + '/scored'); if(r.ok){scoredData=await r.json();return;} } catch(e){}
    try { var r2 = await fetch('../data/uvg-grid-scored-findings.json'); if(r2.ok){scoredData=await r2.json();} } catch(e){}
}
// =====================================================================
// LAYER 1: THE GRID — clean vertices (diamonds) + faint triangle edges
// =====================================================================
function drawGrid() {
    gridLayer.clearLayers();
    var nodeMap = {};
    allNodes.forEach(function(n){ nodeMap[n.id] = n; });

    // Draw triangle edges (faint)
    GRID_TRIANGLES.forEach(function(edge) {
        var a = nodeMap[edge[0]], b = nodeMap[edge[1]];
        if (!a || !b) return;
        if (Math.abs(a.lat) >= 85 || Math.abs(b.lat) >= 85) return;
        var ld = Math.abs(a.lng - b.lng);
        if (ld > 120) return; // skip antimeridian wraps
        L.polyline([[a.lat,a.lng],[b.lat,b.lng]], {
            color:'#718096', weight:0.9, opacity:0.6
        }).addTo(gridLayer);
    });

    // Draw vertices as small diamonds
    allNodes.forEach(function(n) {
        if (Math.abs(n.lat) >= 85) return;
        var icon = L.divIcon({
            className:'grid-vertex',
            html:'<svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,0 10,5 5,10 0,5" fill="none" stroke="#a0aec0" stroke-width="1.5"/></svg>',
            iconSize:[10,10], iconAnchor:[5,5]
        });
        var marker = L.marker([n.lat, n.lng], {icon:icon}).addTo(gridLayer);
        marker.bindTooltip('Vertex ' + n.id, {direction:'top', offset:[0,-6], className:'node-label'});
        marker.nodeData = n;
        marker.on('click', function(){ showNodeBrief(n); });
    });
}

// =====================================================================
// LAYER 2: KNOWN SITES — circles at real coordinates, linked to vertex
// =====================================================================
function drawSites() {
    siteLayer.clearLayers();
    KNOWN_SITES.forEach(function(site) {
        var node = allNodes.find(function(n){ return n.id === site.nodeId; });
        if (!node) return;

        // Site circle at real coordinates
        var marker = L.circleMarker([site.realLat, site.realLng], {
            radius: 7, color:'#48bb78', fillColor:'#48bb78', fillOpacity:0.7, weight:1.5
        }).addTo(siteLayer);
        marker.bindTooltip(site.name, {direction:'top', offset:[0,-8], className:'node-label', permanent:false});
        marker.on('click', function(){ showNodeBrief(node); });

        // Thin dotted line from site to its nearest grid vertex
        L.polyline([[site.realLat, site.realLng],[node.lat, node.lng]], {
            color:'#48bb78', weight:0.8, opacity:0.3, dashArray:'2,4'
        }).addTo(siteLayer);
    });
}
// =====================================================================
// LAYER 3: PATTERN FOCUS — hide everything irrelevant, spotlight matches
// =====================================================================
function focusPattern(patternId) {
    // Clear previous focus
    focusLayer.clearLayers();
    map.removeLayer(focusLayer);

    if (_focusedPattern === patternId) {
        // Toggle off — back to clean view
        _focusedPattern = null;
        siteLayer.eachLayer(function(l){ if(l.setStyle) l.setStyle({opacity:0.7, fillOpacity:0.7}); if(l.setOpacity) l.setOpacity(1); });
        closeNetworkGraph();
        renderSidebar();
        return;
    }

    _focusedPattern = patternId;

    // Get nodes matching this pattern (from scored data)
    var matchNodeIds = getMatchingNodes(patternId);
    var nodeMap = {};
    allNodes.forEach(function(n){ nodeMap[n.id] = n; });

    // DIM the sites only — keep grid visible for geographic context
    siteLayer.eachLayer(function(l){ if(l.setStyle) l.setStyle({opacity:0.1, fillOpacity:0.1}); if(l.setOpacity) l.setOpacity(0.15); });

    // Draw ONLY matching nodes as bright circles
    var focusNodes = [];
    matchNodeIds.forEach(function(id) {
        var n = nodeMap[id];
        if (!n || Math.abs(n.lat) >= 85) return;
        focusNodes.push(n);

        // Check if this is a known site — use real coords
        var site = KNOWN_SITES.find(function(s){ return s.nodeId === id; });
        var lat = site ? site.realLat : n.lat;
        var lng = site ? site.realLng : n.lng;
        var name = site ? site.name : getNodeLabel(n);

        var marker = L.circleMarker([lat, lng], {
            radius: 9, color:'#ecc94b', fillColor:'#ecc94b', fillOpacity:0.6, weight:2
        }).addTo(focusLayer);
        marker.bindTooltip(name, {direction:'top', offset:[0,-8], className:'node-label', permanent: matchNodeIds.length <= 12});
        marker.on('click', function(){ showNodeBrief(n); highlightNetworkNode(n.id); });
    });

    // NO connection lines on the map — relationships shown in network graph below
    // drawFocusConnections(patternId, matchNodeIds, nodeMap);

    focusLayer.addTo(map);

    // Fit bounds to focus nodes
    if (focusNodes.length > 1) {
        var bounds = focusNodes.map(function(n){
            var site = KNOWN_SITES.find(function(s){ return s.nodeId === n.id; });
            return [site ? site.realLat : n.lat, site ? site.realLng : n.lng];
        });
        map.fitBounds(bounds, {padding:[40,40], maxZoom:5});
    }

    // Auto-show network graph for this pattern
    showNetworkGraph(patternId);

    renderSidebar();
}
function drawFocusConnections(patternId, matchNodeIds, nodeMap) {
    // Only draw lines between nodes sharing SPECIFIC non-generic indicators
    if (!scoredData || !scoredData.results) return;

    var sigId = PATTERNS.find(function(p){ return p.id === patternId; });
    if (!sigId) return;
    sigId = sigId.sigId;

    var genericTerms = ['Within','km','node','ocean'];

    for (var i = 0; i < matchNodeIds.length; i++) {
        for (var j = i + 1; j < matchNodeIds.length; j++) {
            var sA = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[i]; });
            var sB = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[j]; });
            if (!sA || !sB) continue;

            var mA = sA.matches.find(function(m){ return m.signature_id === sigId; });
            var mB = sB.matches.find(function(m){ return m.signature_id === sigId; });
            if (!mA || !mB) continue;

            // Both must be strong or moderate
            if (mA.confidence === 'weak' || mB.confidence === 'weak') continue;

            var indA = mA.matched_indicators || [];
            var indB = mB.matched_indicators || [];
            var shared = indA.filter(function(x){
                if (genericTerms.some(function(g){ return x.indexOf(g) >= 0; })) return false;
                return indB.indexOf(x) >= 0;
            });
            if (shared.length === 0) continue;

            var nA = nodeMap[matchNodeIds[i]], nB = nodeMap[matchNodeIds[j]];
            if (!nA || !nB) continue;
            var siteA = KNOWN_SITES.find(function(s){ return s.nodeId === nA.id; });
            var siteB = KNOWN_SITES.find(function(s){ return s.nodeId === nB.id; });
            var latA = siteA ? siteA.realLat : nA.lat, lngA = siteA ? siteA.realLng : nA.lng;
            var latB = siteB ? siteB.realLat : nB.lat, lngB = siteB ? siteB.realLng : nB.lng;

            if (Math.abs(lngA - lngB) > 180) continue;

            var line = L.polyline([[latA,lngA],[latB,lngB]], {
                color:'#ecc94b', weight: 1 + shared.length * 0.5, opacity: 0.4 + shared.length * 0.1
            }).addTo(focusLayer);
            var nameA = siteA ? siteA.name : getNodeLabel(nA);
            var nameB = siteB ? siteB.name : getNodeLabel(nB);
            line.bindTooltip(nameA + ' ↔ ' + nameB + ': ' + shared.join(', '), {sticky:true, className:'node-label'});
        }
    }
}

function getMatchingNodes(patternId) {
    if (!scoredData || !scoredData.results) return [];
    var pattern = PATTERNS.find(function(p){ return p.id === patternId; });
    if (!pattern) return [];
    var ids = [];
    scoredData.results.forEach(function(r) {
        if (!r.matches) return;
        var hit = r.matches.find(function(m){ return m.signature_id === pattern.sigId; });
        if (hit && hit.confidence !== 'weak') ids.push(r.node_id);
    });
    return ids;
}

function getNodeLabel(n) {
    // Priority: known site name → AI codename → continent
    if (n.nearest_known_site) return 'V' + n.id + ' ' + n.nearest_known_site;
    var site = KNOWN_SITES.find(function(s){ return s.nodeId === n.id; });
    if (site) return 'V' + n.id + ' ' + site.name;
    // Try codename from research data
    if (researchData && researchData.results) {
        var r = researchData.results.find(function(x){ return x.node_id === n.id; });
        if (r && r.brief && r.brief.codename) {
            // Convert APEX_GIZA → Apex Giza, TOBOL_STEPPE → Tobol Steppe
            var name = r.brief.codename.replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); }).replace(/\b(Node|Grid)\b/gi,'').trim();
            if (name.length > 20) name = name.substring(0,18) + '..';
            return 'V' + n.id + ' ' + name;
        }
    }
    // Fallback: continent
    return 'V' + n.id + (n.continent ? ' ' + n.continent : '');
}

function renderSidebar() {
    var sb = document.getElementById('sidebar');
    var html = '';

    if (_focusedPattern) {
        // Focused mode: show pattern brief + matching nodes
        var p = PATTERNS.find(function(x){ return x.id === _focusedPattern; });
        var matchIds = getMatchingNodes(_focusedPattern);
        html += '<span class="back-link" onclick="focusPattern(\'' + _focusedPattern + '\')">← Back to all patterns</span>';
        html += '<div style="font-size:0.85rem;font-weight:700;color:'+p.color+';margin-bottom:4px;">'+p.title+'</div>';
        html += '<div style="font-size:0.62rem;color:#ecc94b;margin-bottom:10px;">'+matchIds.length+' vertices match (strong/moderate)</div>';
        html += '<div style="font-size:0.7rem;color:#cbd5e0;line-height:1.5;margin-bottom:14px;">'+p.brief+'</div>';
        html += '<div style="margin-bottom:12px;"><button onclick="showNetworkGraph(\'' + _focusedPattern + '\')" style="background:rgba(183,148,244,0.1);border:1px solid rgba(183,148,244,0.3);border-radius:5px;padding:6px 12px;font-size:0.68rem;color:#b794f4;cursor:pointer;width:100%;">🕸️ View Network Graph</button></div>';
        html += '<div class="section-title">Matching Vertices</div>';
        matchIds.forEach(function(id) {
            var n = allNodes.find(function(x){ return x.id === id; });
            if (!n) return;
            var label = getNodeLabel(n);
            html += '<div style="font-size:0.68rem;color:#a0aec0;padding:4px 0;cursor:pointer;" onclick="showNodeBrief(allNodes.find(function(x){return x.id==='+id+'}))">';
            html += '<span style="color:'+p.color+'">●</span> ' + label + '</div>';
        });
    } else {
        // Default: show ley line summary + patterns list
        html += '<div style="font-size:0.78rem;font-weight:700;color:#ecc94b;margin-bottom:6px;">Ley Lines & The World Grid</div>';
        html += '<div style="font-size:0.67rem;color:#cbd5e0;line-height:1.5;margin-bottom:14px;">';
        html += 'In 1921, Alfred Watkins noticed ancient sites in England aligned along invisible straight lines he called "ley lines." ';
        html += 'Researchers since — John Michell, Jim Alison, the Becker-Hagens team — found these alignments extend globally. ';
        html += 'The St Michael\'s Line runs 364 miles through 7 sacred sites. The Great Alignment connects Giza, Petra, Angkor Wat, and Nazca along a single great circle. ';
        html += 'The UVG grid proposes 62 vertices where these planetary lines intersect — an icosahedral geometry overlaid on Earth. ';
        html += 'This dashboard plots those vertices, overlays known ancient sites, and lets you focus on specific patterns to see which connections have evidence.</div>';

        html += '<div class="section-title">Focus on a Pattern</div>';
        html += '<div style="font-size:0.63rem;color:#718096;margin-bottom:8px;">Click to hide everything else. See only what matters to this story.</div>';
        PATTERNS.forEach(function(p) {
            var count = getMatchingNodes(p.id).length;
            var cls = (_focusedPattern === p.id) ? ' active' : '';
            html += '<div class="pattern-card'+cls+'" onclick="focusPattern(\''+p.id+'\')" style="border-left:3px solid '+p.color+'">';
            html += '<div class="p-title">'+p.title+'</div>';
            html += '<div class="p-count">'+count+' vertices (strong/moderate)</div>';
            html += '</div>';
        });

        html += '<div class="section-title" style="margin-top:20px;">Known Sites</div>';
        KNOWN_SITES.forEach(function(site) {
            html += '<div style="font-size:0.68rem;color:#a0aec0;padding:3px 0;cursor:pointer;" onclick="showNodeBrief(allNodes.find(function(x){return x.id==='+site.nodeId+'}))">';
            html += '<span style="color:#48bb78">●</span> ' + site.name + '</div>';
        });

        // Emergent Patterns section
        html += '<div class="section-title" style="margin-top:20px;color:#b794f4;">🔮 Emergent Patterns (AI-detected)</div>';
        html += '<div style="font-size:0.63rem;color:#718096;margin-bottom:8px;">Clusters found by OpenSearch k-NN similarity that don\'t match any existing signature — patterns you didn\'t search for.</div>';
        html += '<div id="emergentPatterns" style="font-size:0.66rem;color:#a0aec0;">Loading...</div>';
    }

    sb.innerHTML = html;
    // Render emergent patterns if data already loaded
    if (emergentData && !_focusedPattern) renderEmergent();
}
// =====================================================================
// NODE CLICK → AI INTELLIGENCE BRIEF (replaces sidebar content)
// =====================================================================
function showNodeBrief(node) {
    if (!node) return;
    var sb = document.getElementById('sidebar');
    var brief = null, scored = null;

    if (researchData && researchData.results) {
        var r = researchData.results.find(function(x){ return x.node_id === node.id; });
        if (r) brief = r.brief;
    }
    if (scoredData && scoredData.results) {
        scored = scoredData.results.find(function(x){ return x.node_id === node.id; });
    }

    var html = '<span class="back-link" onclick="renderSidebar()">← Back</span>';

    if (brief) {
        var statusCls = brief.investigation_status === 'CONFIRMED' ? 'confirmed' :
                        brief.investigation_status === 'PROBABLE' ? 'probable' : 'inconclusive';
        html += '<div class="intel visible">';
        html += '<div class="intel-head"><span class="intel-code">'+brief.codename+'</span>';
        html += '<span class="intel-badge '+statusCls+'">'+brief.investigation_status+'</span></div>';
        html += '<div class="intel-text">'+brief.situation+'</div>';

        if (brief.smoking_gun) {
            html += '<div class="intel-key"><div class="lbl">💡 Key Finding</div>';
            html += '<div class="val">'+brief.smoking_gun+'</div></div>';
        }

        // Signatures
        if (scored && scored.matches && scored.matches.length > 0) {
            html += '<div class="section-title">Signatures Matched</div>';
            scored.matches.forEach(function(m) {
                var p = PATTERNS.find(function(x){ return x.sigId === m.signature_id; });
                var name = p ? p.title : m.signature_id;
                var color = p ? p.color : '#63b3ed';
                html += '<div style="font-size:0.65rem;margin:3px 0;"><span style="color:'+color+'">✓</span> '+name+' <span style="color:#718096">('+m.confidence+')</span></div>';
            });
        }

        // Evidence
        if (brief.evidence_found && brief.evidence_found.length > 0) {
            html += '<div class="section-title" style="margin-top:12px">Evidence</div>';
            brief.evidence_found.slice(0,5).forEach(function(ev) {
                html += '<div class="ev-item '+ev.confidence+'">'+ev.finding;
                html += '<div class="src">'+ev.source_type+'</div></div>';
            });
        }

        html += '</div>';
    } else {
        html += '<div class="intel visible">';
        html += '<div class="intel-head"><span class="intel-code">VERTEX '+node.id+'</span>';
        html += '<span class="intel-badge inconclusive">NO DATA</span></div>';
        html += '<div class="intel-text">No AI research brief generated for this vertex yet. ';
        html += 'Classification: '+(node.classification||'unknown').replace(/_/g,' ')+'. ';
        html += 'Coordinates: '+node.lat.toFixed(2)+'°, '+node.lng.toFixed(2)+'°</div>';
        html += '</div>';
    }

    sb.innerHTML = html;

    // Pulse this node on map
    map.setView([node.lat, node.lng], Math.max(map.getZoom(), 4), {animate:true});
}

function toggleLeyLines() {
    var btn = document.getElementById('btnLey');
    if (_leyLinesOn) {
        map.removeLayer(leyLineLayer);
        leyLineLayer.clearLayers();
        _leyLinesOn = false;
        if (btn) btn.classList.remove('active');
    } else {
        leyLineLayer.clearLayers();

// NETWORK GRAPH (D3 force-directed) — opens over map on pattern focus
// =====================================================================
function showNetworkGraph(patternId) {
    var pattern = PATTERNS.find(function(p){ return p.id === patternId; });
    if (!pattern || !scoredData) return;

    var panel = document.getElementById('networkPanel');
    var title = document.getElementById('networkTitle');
    panel.style.display = 'flex';
    setTimeout(function(){ map.invalidateSize(); }, 100);

    // Build nodes and edges from scored data
    var matchNodeIds = getMatchingNodes(patternId);
    var nodes = [];
    var edges = [];

    matchNodeIds.forEach(function(id) {
        var n = allNodes.find(function(x){ return x.id === id; });
        if (!n) return;
        var label = getNodeLabel(n);
        var scored = scoredData.results.find(function(r){ return r.node_id === id; });
        var matchCount = scored ? scored.matches.length : 0;
        nodes.push({id: id, label: label, continent: n.continent || 'Ocean', matchCount: matchCount});
    });

    // ONLY draw edges between nodes sharing SPECIFIC non-generic indicators
    var genericTerms = ['Within','km','node','ocean','Indigenous oral tradition','500+ year continuity','Plate boundary','High seismic','Shallow plateau','Depth <200m'];
    if (scoredData && scoredData.results) {
        for (var i = 0; i < matchNodeIds.length; i++) {
            for (var j = i + 1; j < matchNodeIds.length; j++) {
                var sA = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[i]; });
                var sB = scoredData.results.find(function(r){ return r.node_id === matchNodeIds[j]; });
                if (!sA || !sB) continue;
                var mA = (sA.matches || []).find(function(m){ return m.signature_id === pattern.sigId; });
                var mB = (sB.matches || []).find(function(m){ return m.signature_id === pattern.sigId; });
                if (!mA || !mB) continue;
                if (mA.confidence === 'weak' || mB.confidence === 'weak') continue;
                var indA = mA.matched_indicators || [];
                var indB = mB.matched_indicators || [];
                var shared = indA.filter(function(x){
                    if (genericTerms.some(function(g){ return x.indexOf(g) >= 0; })) return false;
                    return indB.indexOf(x) >= 0;
                });
                if (shared.length > 0) {
                    edges.push({source: matchNodeIds[i], target: matchNodeIds[j], label: shared[0], weight: shared.length});
                }
            }
        }
        // Cap at 15 edges max to prevent spaghetti
        if (edges.length > 15) {
            edges.sort(function(a,b){ return b.weight - a.weight; });
            edges = edges.slice(0, 15);
        }
    }

    // Generate intelligence summary
    var summary = generatePatternInsight(pattern, nodes, edges);
    title.innerHTML = '🕸️ <span style="color:#e2e8f0;font-weight:400;font-size:0.65rem;margin-left:8px;">' + summary + '</span>';

    renderD3Network(nodes, edges, pattern.color);
}

function generatePatternInsight(pattern, nodes, edges) {
    var continents = {};
    nodes.forEach(function(n){ continents[n.continent] = (continents[n.continent]||0) + 1; });
    var numContinents = Object.keys(continents).filter(function(c){ return c !== 'Ocean'; }).length;
    
    if (pattern.id === 'sacred') {
        return nodes.length + ' sites on ' + numContinents + ' continents independently designated sacred — ' + (edges.length > 0 ? edges.length + ' share specific ceremonial traits' : 'no specific shared ceremonies documented yet');
    } else if (pattern.id === 'cluster') {
        return nodes.length + ' vertices show improbable site clustering (5+ ancient sites within 300km) — ' + (edges.length > 0 ? 'connected by shared archaeological features' : 'each cluster is independently significant');
    } else if (pattern.id === 'submerged') {
        return nodes.length + ' ocean vertices sit on shallow platforms (<200m) that were habitable land 12,000+ years ago';
    } else if (pattern.id === 'tectonic') {
        return nodes.length + ' vertices coincide with plate boundaries or volcanic hotspots — suggesting geomagnetic selection of grid points';
    } else if (pattern.id === 'geometric') {
        return nodes.length + ' vertices show geometric precision in natural or constructed features visible from satellite';
    }
    return nodes.length + ' vertices match this pattern across ' + numContinents + ' continents';
}

function renderD3Network(nodes, edges, color) {
    var svg = d3.select('#networkSvg');
    svg.selectAll('*').remove();

    var panel = document.getElementById('networkPanel');
    var width = panel.clientWidth || 700;
    var height = 220;

    svg.attr('viewBox', '0 0 ' + width + ' ' + height);

    // Color by continent
    var continentColors = {
        'Africa': '#ecc94b', 'Asia': '#fc8181', 'Europe': '#48bb78',
        'North America': '#63b3ed', 'South America': '#b794f4',
        'Oceania': '#ed64a6', 'Ocean': '#4a5568', 'Pacific': '#4a5568'
    };

    var simulation = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(edges).id(function(d){ return d.id; }).distance(100))
        .force('charge', d3.forceManyBody().strength(-250))
        .force('center', d3.forceCenter(width / 2, height / 2))
        .force('collision', d3.forceCollide().radius(45));

    // Draw edges
    var link = svg.append('g').selectAll('line')
        .data(edges).enter().append('line')
        .attr('class', 'link-line')
        .attr('stroke', color)
        .attr('stroke-width', function(d){ return Math.min(d.weight + 0.5, 3); });

    // Draw nodes
    var node = svg.append('g').selectAll('g')
        .data(nodes).enter().append('g')
        .attr('class', 'network-node-group')
        .attr('cursor', 'pointer')
        .call(d3.drag()
            .on('start', function(event, d){ if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', function(event, d){ d.fx = event.x; d.fy = event.y; })
            .on('end', function(event, d){ if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
        );

    // Circle for each node
    node.append('circle')
        .attr('class', 'node-circle')
        .attr('r', function(d){ return d.isHub ? 14 : 8 + (d.matchCount || 0) * 2; })
        .attr('fill', function(d){ return continentColors[d.continent] || color; })
        .attr('stroke', '#1a202c')
        .attr('stroke-width', 2)
        .attr('data-node-id', function(d){ return d.id; });

    // Labels always visible
    node.append('text')
        .attr('class', 'node-text')
        .attr('dy', function(d){ return (d.isHub ? 14 : 8 + (d.matchCount || 0) * 2) + 12; })
        .attr('fill', '#e2e8f0')
        .attr('font-size', '8px')
        .attr('text-anchor', 'middle')
        .text(function(d){ 
            var lbl = d.label || d.id || '';
            return lbl.length > 16 ? lbl.substring(0,14) + '..' : lbl;
        });

    // Click node in network graph → show insight + highlight on map
    node.on('click', function(event, d) {
        // Find the allNodes entry
        var mapNode = allNodes.find(function(n){ return n.id === d.id; });
        
        if (mapNode) {
            // Pulse on map
            L.circleMarker([mapNode.lat, mapNode.lng], {
                radius: 18, color: '#fff', fillColor: 'transparent', weight: 2, opacity: 0.8
            }).addTo(focusLayer);
            map.setView([mapNode.lat, mapNode.lng], Math.max(map.getZoom(), 4), {animate: true});
        }
        
        // Show brief in the network panel's brief area
        showNetworkNodeBrief(d.id);
        
        // Highlight in network
        svg.selectAll('.node-circle').attr('stroke', '#1a202c').attr('stroke-width', 2);
        d3.select(this).select('circle').attr('stroke', '#fff').attr('stroke-width', 3);
    });
    
    // Hover shows quick tooltip
    node.on('mouseenter', function(event, d) {
        var briefPanel = document.getElementById('networkBrief');
        var n = allNodes.find(function(x){ return x.id === d.id; });
        if (!n) return;
        var brief = null;
        if (researchData && researchData.results) {
            var r = researchData.results.find(function(x){ return x.node_id === d.id; });
            if (r) brief = r.brief;
        }
        if (brief) {
            briefPanel.innerHTML = '<div style="color:#ecc94b;font-weight:700;font-size:0.72rem;margin-bottom:4px;">' + brief.codename + '</div>' +
                '<div style="color:#cbd5e0;margin-bottom:6px;">' + brief.situation.split('.').slice(0,2).join('.') + '.</div>' +
                (brief.smoking_gun ? '<div style="color:#ecc94b;font-size:0.62rem;margin-top:4px;">💡 ' + brief.smoking_gun.split('.')[0] + '.</div>' : '');
        } else {
            briefPanel.innerHTML = '<div style="color:#e2e8f0;font-weight:600;">' + getNodeLabel(n) + '</div><div style="color:#718096;margin-top:4px;">No research brief available.</div>';
        }
    });

    // Tick
    simulation.on('tick', function() {
        link.attr('x1', function(d){ return d.source.x; }).attr('y1', function(d){ return d.source.y; })
            .attr('x2', function(d){ return d.target.x; }).attr('y2', function(d){ return d.target.y; });
        node.attr('transform', function(d){ return 'translate(' + d.x + ',' + d.y + ')'; });
    });

    // Store reference for cross-highlighting from map clicks
    window._networkSvg = svg;
    window._networkNodes = nodes;
}

var emergentData = null;

async function loadEmergentPatterns() {
    try {
        var r = await fetch(API_BASE + '/emergent');
        if (r.ok) { emergentData = await r.json(); renderEmergent(); return; }
    } catch(e) {}
    try {

function renderEmergent() {
    var el = document.getElementById('emergentPatterns');
    if (!el || !emergentData || !emergentData.patterns) return;

    // Group into clusters (multiple pairs involving same nodes = a cluster)
    var nodeCounts = {};
    emergentData.patterns.forEach(function(p) {
        nodeCounts[p.node_a_name] = (nodeCounts[p.node_a_name] || 0) + 1;
        nodeCounts[p.node_b_name] = (nodeCounts[p.node_b_name] || 0) + 1;
    });

    // Find the most-connected nodes (hubs of emergent clusters)
    var hubs = Object.entries(nodeCounts).sort(function(a,b){ return b[1]-a[1]; }).slice(0,5);

    var html = '';
    hubs.forEach(function(hub, i) {
        var name = hub[0];
        var count = hub[1];
        // Find what themes this hub shares
        var themes = new Set();
        emergentData.patterns.forEach(function(p) {
            if (p.node_a_name === name || p.node_b_name === name) {
                (p.shared_themes || []).forEach(function(t){ themes.add(t); });
            }
        });
        var themeStr = Array.from(themes).slice(0,4).join(', ');
        html += '<div style="padding:5px 0;border-bottom:1px solid rgba(183,148,244,0.1);cursor:pointer;" onclick="focusEmergentHub(\'' + name.replace(/'/g,"\\'") + '\')">';
        html += '<span style="color:#b794f4;font-weight:600;">' + (i+1) + '.</span> ';
        html += '<span style="color:#e2e8f0;">' + name + '</span>';
        html += '<div style="font-size:0.58rem;color:#718096;margin-top:2px;">';
        html += 'Connected to ' + count + ' other nodes | Themes: ' + (themeStr || 'deep similarity');
        html += '</div></div>';
    });

    html += '<div style="font-size:0.55rem;color:#718096;margin-top:8px;">';
    html += emergentData.total_pairs + ' unexpected similarity pairs detected.';
    html += '</div>';

    el.innerHTML = html;
}

// EMERGENT HUB FOCUS — click an emergent pattern to explore it
// =====================================================================
function focusEmergentHub(hubName) {
    if (!emergentData) return;

    // Find all nodes connected to this hub
    var connectedNodes = new Set();
    var connections = [];
    connectedNodes.add(hubName);

    emergentData.patterns.forEach(function(p) {
        if (p.node_a_name === hubName) {
            connectedNodes.add(p.node_b_name);
            connections.push({from: p.node_a_name, to: p.node_b_name, similarity: p.similarity, themes: p.shared_themes || []});
        } else if (p.node_b_name === hubName) {
            connectedNodes.add(p.node_a_name);
            connections.push({from: p.node_a_name, to: p.node_b_name, similarity: p.similarity, themes: p.shared_themes || []});
        }
    });

    // Find node IDs for these codenames
    var matchNodeIds = [];
    allNodes.forEach(function(n) {
        var brief = null;
        if (researchData && researchData.results) {
            var r = researchData.results.find(function(x){ return x.node_id === n.id; });
            if (r) brief = r.brief;
        }
        var codename = brief ? brief.codename : '';
        if (connectedNodes.has(codename) || connectedNodes.has(n.nearest_known_site || '')) {
            matchNodeIds.push(n.id);
        }
    });

    // Focus the map on these nodes
    focusLayer.clearLayers();
    map.removeLayer(focusLayer);
    // Dim sites only — keep grid skeleton visible
    siteLayer.eachLayer(function(l){ if(l.setStyle) l.setStyle({opacity:0.1, fillOpacity:0.1}); if(l.setOpacity) l.setOpacity(0.15); });

    var focusNodes = [];
    matchNodeIds.forEach(function(id) {
        var n = allNodes.find(function(x){ return x.id === id; });

        L.circleMarker([n.lat, n.lng], {
            radius: 9, color:'#b794f4', fillColor:'#b794f4', fillOpacity:0.6, weight:2

        map.fitBounds(bounds, {padding:[40,40], maxZoom:5});
    }

    // Show network graph below
    showEmergentNetwork(hubName, connectedNodes, connections);

    // Update sidebar with AI summary
    var sb = document.getElementById('sidebar');
    var allThemes = new Set();
    connections.forEach(function(c){ c.themes.forEach(function(t){ allThemes.add(t); }); });

    var html = '<span class="back-link" onclick="resetFromEmergent()">← Back to all patterns</span>';
    html += '<div style="font-size:0.82rem;font-weight:700;color:#b794f4;margin-bottom:4px;">🔮 Emergent Pattern: ' + hubName + '</div>';
    html += '<div style="font-size:0.62rem;color:#ecc94b;margin-bottom:10px;">' + connectedNodes.size + ' nodes in cluster | ' + connections.length + ' connections</div>';

    // Documentary-style AI summary
    html += '<div style="font-size:0.7rem;color:#cbd5e0;line-height:1.5;margin-bottom:12px;">';
    html += '<strong style="color:#ecc94b;">THE ANOMALY:</strong> OpenSearch k-NN similarity analysis detected that ';
    html += connectedNodes.size + ' grid vertices share unusually high semantic similarity (>';
    html += '0.75 cosine) despite having NO common taxonomy signature. ';
    html += 'Shared themes include: <em>' + Array.from(allThemes).slice(0,6).join(', ') + '</em>. ';
    html += 'This cluster was not searched for — it emerged from cross-document vector analysis.</div>';

    html += '<div style="background:rgba(183,148,244,0.06);border:1px solid rgba(183,148,244,0.15);border-radius:6px;padding:9px;margin-bottom:12px;">';
    html += '<div style="font-size:0.58rem;font-weight:700;color:#b794f4;text-transform:uppercase;margin-bottom:3px;">💡 Why This Matters</div>';
    html += '<div style="font-size:0.68rem;color:#e2e8f0;line-height:1.5;">';
    html += 'These nodes share language patterns that suggest a COMMON characteristic not captured by any existing signature. ';
    html += 'This is a candidate for a NEW taxonomy signature — the system found a pattern the investigator didn\'t know to look for.</div></div>';

    html += '<div class="section-title">Connected Nodes</div>';
    Array.from(connectedNodes).forEach(function(name) {
        html += '<div style="font-size:0.68rem;color:#a0aec0;padding:3px 0;">';
        html += '<span style="color:#b794f4">●</span> ' + name + '</div>';
    });

    html += '<div class="section-title" style="margin-top:12px;">Connections</div>';
    connections.slice(0,8).forEach(function(c) {
        html += '<div style="font-size:0.62rem;color:#718096;padding:2px 0;">';
        html += c.from + ' ↔ ' + c.to + ' <span style="color:#b794f4">(sim: ' + c.similarity + ')</span></div>';
    });

    sb.innerHTML = html;
}

function showEmergentNetwork(hubName, nodeNames, connections) {
    var panel = document.getElementById('networkPanel');
    var title = document.getElementById('networkTitle');
    title.textContent = '🕸️ ' + hubName + ' cluster';
    panel.style.display = 'flex';
    setTimeout(function(){ map.invalidateSize(); }, 100);

    // Build D3 nodes
    var nodesArr = Array.from(nodeNames).map(function(name) {
        return {id: name, label: name, isHub: name === hubName};
    });

    // Build D3 edges
    var edgesArr = connections.map(function(c) {
        return {source: c.from, target: c.to, weight: Math.round(c.similarity * 10) / 10};
    });

    renderD3Network(nodesArr, edgesArr, '#b794f4');
}

function resetFromEmergent() {
    _focusedPattern = null;
    focusLayer.clearLayers();
    map.removeLayer(focusLayer);
    siteLayer.eachLayer(function(l){ if(l.setStyle) l.setStyle({opacity:0.7, fillOpacity:0.7}); if(l.setOpacity) l.setOpacity(1); });
    closeNetworkGraph();
    renderSidebar();
}

// =====================================================================
// AUDIO BRIEFING PLAYER with CUE SHEET ANIMATION
// =====================================================================
var audioData = null;
var cueSheet = null;
var currentChapter = 0;
var isPlaying = false;
var cueInterval = null;
var lastCueIndex = -1;

async function loadAudioData() {
    // Load audio manifest (presigned URLs for chapters)
    try {
        var r = await fetch(API_BASE + '/audio');
        if (r.ok) audioData = await r.json();
    } catch(e) { console.log('Audio API failed:', e); }
    
    // Cue sheet and script are already inline (INLINE_CUE_SHEET, INLINE_SCRIPT_DATA)
    cueSheet = INLINE_CUE_SHEET;
    if (INLINE_SCRIPT_DATA) _scriptData = INLINE_SCRIPT_DATA;
}

function toggleAudioPlayer() {
    var player = document.getElementById('audioPlayer');
    if (player.style.display === 'none') {
        player.style.display = 'block';
        if (audioData && audioData.chapters) {
            document.getElementById('audioTitle').textContent = audioData.title || 'Research Briefing';
            renderChapterList();
        } else {
            loadAudioData().then(function() {
                if (audioData && audioData.chapters) {
                    document.getElementById('audioTitle').textContent = audioData.title || 'Research Briefing';
                    renderChapterList();
                }
            });
        }
    } else {
        player.style.display = 'none';
        stopPlayback();
    }
}

function renderChapterList() {
    if (!audioData || !audioData.chapters) return;
    var list = document.getElementById('chapterList');
    var html = '<button onclick="playChapter(\'all\')" style="background:rgba(183,148,244,0.1);border:1px solid rgba(183,148,244,0.3);border-radius:4px;padding:3px 8px;font-size:0.58rem;color:#b794f4;cursor:pointer;">▶ All</button>';
    audioData.chapters.forEach(function(ch, i) {
        html += '<button onclick="playChapter(' + i + ')" id="chBtn' + i + '" style="background:rgba(255,255,255,0.03);border:1px solid #4a5568;border-radius:4px;padding:3px 8px;font-size:0.58rem;color:#a0aec0;cursor:pointer;">' + ch.chapter + '. ' + ch.title + '</button>';
    });
    list.innerHTML = html;
}

function highlightChapterBtn(idx) {
    if (!audioData) return;
    audioData.chapters.forEach(function(ch, i) {
        var btn = document.getElementById('chBtn' + i);
        if (btn) {
            btn.style.borderColor = (i === idx) ? '#b794f4' : '#4a5568';
            btn.style.color = (i === idx) ? '#b794f4' : '#a0aec0';
            btn.style.background = (i === idx) ? 'rgba(183,148,244,0.12)' : 'rgba(255,255,255,0.03)';
        }
    });
}

function playChapter(val) {
    if (!audioData) return;
    var audio = document.getElementById('audioElement');
    
    // Reset cue fired flags
    if (cueSheet) cueSheet.chapters.forEach(function(ch){ ch.cues.forEach(function(c){ c._fired = false; }); });
    
    if (val === 'all') {
        audio.src = audioData.full_url;
        currentChapter = 0;
        document.getElementById('audioChapter').textContent = 'Full Briefing';
    } else {
        currentChapter = parseInt(val);
        var ch = audioData.chapters[currentChapter];
        audio.src = ch.url;
        document.getElementById('audioChapter').textContent = 'Ch ' + ch.chapter + ': ' + ch.title;
    }
    // Maintain speed setting
    audio.playbackRate = parseFloat(document.getElementById('speedSelect').value);
    audio.play();
    isPlaying = true;
    document.getElementById('playBtn').textContent = '⏸️';
    highlightChapterBtn(currentChapter);
    startCueEngine();
}

function playPause() {
    var audio = document.getElementById('audioElement');
    if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('playBtn').textContent = '▶️';
        stopCueEngine();
    } else {
        if (!audio.src && audioData && audioData.chapters) {
            playChapter('all');
        } else {
            audio.play();
            isPlaying = true;
            document.getElementById('playBtn').textContent = '⏸️';
            startCueEngine();
        }
    }
}

function nextChapter() {
    if (!audioData) return;
    currentChapter++;
    if (currentChapter < audioData.chapters.length) {
        playChapter(currentChapter);
        document.getElementById('chapterSelect').value = currentChapter;
    } else {
        stopPlayback();
        document.getElementById('audioChapter').textContent = 'Briefing complete';
    }
}

function stopPlayback() {
    var audio = document.getElementById('audioElement');
    audio.pause();
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶️';
    stopCueEngine();
}

function seekBack() {
    var audio = document.getElementById('audioElement');
    audio.currentTime = Math.max(0, audio.currentTime - 10);
}

function seekForward() {
    var audio = document.getElementById('audioElement');
    audio.currentTime = Math.min(audio.duration || 9999, audio.currentTime + 10);
}

function setSpeed(val) {
    var audio = document.getElementById('audioElement');
    audio.playbackRate = parseFloat(val);
}

function scrubAudio(val) {
    var audio = document.getElementById('audioElement');
    if (audio.duration) audio.currentTime = (val / 100) * audio.duration;
}

function updateProgress() {
    var audio = document.getElementById('audioElement');
    if (!audio.duration) return;
    var pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('audioScrubber').value = pct;
    document.getElementById('audioTime').textContent = formatTime(audio.currentTime);
    document.getElementById('audioDuration').textContent = formatTime(audio.duration);
}

function formatTime(s) {
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// =====================================================================
// CUE ENGINE — animates map/network in sync with audio
// =====================================================================
function startCueEngine() {
    if (cueInterval) clearInterval(cueInterval);
    lastCueIndex = -1;
    cueInterval = setInterval(processCues, 500); // Check every 500ms
}

function stopCueEngine() {
    if (cueInterval) { clearInterval(cueInterval); cueInterval = null; }
}

function processCues() {
    if (!cueSheet || !isPlaying) return;
    var audio = document.getElementById('audioElement');
    var currentTime = audio.currentTime;

    // Determine which chapter and offset based on play mode
    var chapterCues = cueSheet.chapters[currentChapter];
    if (!chapterCues) return;

    // If playing full briefing (all chapters in one file), currentTime is absolute
    // If playing individual chapter, offset currentTime by chapter's start_time
    var effectiveTime;
    if (audioData && audioData.full_url && audio.src && audio.src.indexOf('briefing-full') >= 0) {
        // Full briefing mode — absolute time
        effectiveTime = currentTime;
        // Update current chapter based on time
        for (var i = 0; i < cueSheet.chapters.length; i++) {
            var ch = cueSheet.chapters[i];
            if (currentTime >= ch.start_time && currentTime < ch.end_time) {
                if (currentChapter !== i) {
                    currentChapter = i;
                    chapterCues = ch;
                    document.getElementById('audioChapter').textContent = 'Ch ' + ch.chapter + ': ' + ch.title;
                    highlightChapterBtn(i);
                }
                break;
            }
        }
    } else {
        // Individual chapter mode — offset time
        effectiveTime = currentTime + chapterCues.start_time;
    }

    // Process cues that should have fired by now
    chapterCues.cues.forEach(function(cue) {
        if (effectiveTime >= cue.time && cue._fired !== true) {
            cue._fired = true;
            executeCue(cue);
        }
    });
}

function executeCue(cue) {
    switch(cue.action) {
        case 'zoom':
            map.flyTo([cue.target.lat, cue.target.lng], cue.target.zoom, {duration: 1.5});
            hidePip();
            break;
        case 'highlight_site':
            var ring = L.circleMarker([cue.target.lat, cue.target.lng], {
                radius: 15, color: '#ecc94b', fillColor: 'transparent', weight: 2.5, opacity: 0.9
            }).addTo(focusLayer);
            map.flyTo([cue.target.lat, cue.target.lng], cue.target.zoom || 4, {duration: 1.2});
            L.popup({closeButton: false, className: 'node-label', offset: [0, -20]})
                .setLatLng([cue.target.lat, cue.target.lng])
                .setContent('<strong style="color:#ecc94b">' + cue.label + '</strong>')
                .openOn(map);
            setTimeout(function(){ map.closePopup(); }, 8000);
            showPip(cue.label);
            break;
        case 'focus_pattern':
            focusPattern(cue.pattern);
            break;
        case 'show_network':
            showNetworkGraph(cue.pattern);
            break;
        case 'show_card':
            console.log('Card cue:', cue.card);
            break;
    }
}

// =====================================================================
// PHASE 2: LIVE RESEARCH TRIGGERS — search for new findings during playback
// =====================================================================
var _liveSearchDone = {}; // Track which chapters already searched
var RESEARCH_DATE = '2026-07-31'; // Our last research date

function triggerLiveSearch(chapterIdx) {
    if (_liveSearchDone[chapterIdx]) return;
    _liveSearchDone[chapterIdx] = true;

    if (!cueSheet || !cueSheet.chapters[chapterIdx]) return;
    var ch = cueSheet.chapters[chapterIdx];
    var query = ch.live_search_query || ch.title + ' ancient sites new discovery 2026';

    // Call our API which proxies to Tavily
    fetch(API_BASE + '/live-search?q=' + encodeURIComponent(query))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(data) {
            if (data && data.new_finding) {
                showNewFindingPopup(data);
            }
        })
        .catch(function(){});
}

function showNewFindingPopup(data) {
    // Create popup element
    var popup = document.createElement('div');
    popup.className = 'new-finding-popup';
    popup.innerHTML = '<div class="nf-header">🆕 New Finding</div>' +
        '<div class="nf-title">' + (data.title || 'Recent discovery') + '</div>' +
        '<div class="nf-source">' + (data.source || '') + ' • ' + (data.date || 'Recent') + '</div>' +
        '<div class="nf-text">' + (data.summary || '') + '</div>' +
        '<button class="nf-dismiss" onclick="this.parentElement.remove()">✕</button>';
    
    document.querySelector('.map-area').appendChild(popup);
    
    // Auto-dismiss after 12 seconds
    setTimeout(function(){ if (popup.parentElement) popup.remove(); }, 12000);
}

// Override processCues to also trigger live search on chapter change
var _prevChapter = -1;
var _origProcessCues2 = processCues;
processCues = function() {
    _origProcessCues2();
    if (currentChapter !== _prevChapter) {
        _prevChapter = currentChapter;
        triggerLiveSearch(currentChapter);
    }
    if (_captionsOn) updateCaption();
};

// =====================================================================
init();
loadEmergentPatterns();
loadAudioData();

// Caption mode
var _captionsOn = false;
var _scriptData = null;

function toggleCaptions() {
    _captionsOn = !_captionsOn;
    var bar = document.getElementById('captionBar');
    var btn = document.getElementById('captionBtn');
    if (_captionsOn) {
        bar.style.display = 'block';
        btn.style.color = '#ecc94b';
        btn.style.borderColor = '#ecc94b';
        if (!_scriptData) {
            // Try API first, then local
            fetch(API_BASE + '/audio').then(function(r){ return r.json(); }).then(function(d){
                // Audio endpoint doesn't have script text — load separately
                return fetch('../data/audio-briefing-script.json');
            }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
                if (d) { _scriptData = d; updateCaption(); }
            }).catch(function(){
                // Last resort: fetch from S3 via presigned or build from narration in cueSheet
                if (cueSheet) {
                    _scriptData = {chapters: cueSheet.chapters.map(function(c,i){
                        return {chapter: c.chapter, title: c.title, narration: 'Chapter ' + c.chapter + ': ' + c.title + ' — Narration text loading...'};
                    })};
                }
            });
        } else { updateCaption(); }
    } else {
        bar.style.display = 'none';
        btn.style.color = '#a0aec0';
        btn.style.borderColor = '#4a5568';
    }
}

function updateCaption() {
    if (!_captionsOn || !_scriptData || !_scriptData.chapters) return;
    var bar = document.getElementById('captionBar');
    var ch = _scriptData.chapters[currentChapter];
    if (!ch) return;
    var audio = document.getElementById('audioElement');
    var progress = (audio.duration > 0) ? (audio.currentTime / audio.duration) : 0;
    var text = ch.narration;
    var charPos = Math.floor(progress * text.length);
    var start = Math.max(0, charPos - 60);
    var end = Math.min(text.length, charPos + 180);
    var before = text.substring(start, charPos);
    var current = text.substring(charPos, Math.min(charPos + 30, end));
    var after = text.substring(Math.min(charPos + 30, end), end);
    bar.innerHTML = (start > 0 ? '...' : '') + '<span style="color:#718096">' + before + '</span><span style="color:#ecc94b;font-weight:600;background:rgba(236,201,75,0.1);padding:0 2px;border-radius:2px;">' + current + '</span><span style="color:#a0aec0">' + after + '</span>';
}

// Update captions every 500ms alongside cue processing
var _origProcessCues = processCues;
processCues = function() {
    _origProcessCues();
    if (_captionsOn && isPlaying) updateCaption();
};
</script>
